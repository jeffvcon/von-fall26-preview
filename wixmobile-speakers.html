<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Speakers</title><style>
:root{
  --blue:#1438F1; --navy:#0E1320; --ink:#3A4157;
  --ice:#F5F6FA; --line:#DFE3EE; --amber:#F5C24C; --purple:#6B21A8;
  --pad:22px; --sans:'Helvetica Neue',Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#fff;-webkit-text-size-adjust:100%}
body{font-family:var(--sans);font-size:17px;line-height:1.55;color:var(--ink)}
.w{padding:0 var(--pad)}
section{padding:34px 0}
section+section{border-top:1px solid var(--line)}
h1,h2,h3{margin:0;color:var(--navy);letter-spacing:-.02em;text-wrap:balance}
h1{font-size:32px;line-height:1.1;font-weight:800}
h2{font-size:23px;line-height:1.18;font-weight:800;margin-bottom:14px}
h3{font-size:17px;line-height:1.3;font-weight:700}
p{margin:0 0 14px}
p:last-child{margin-bottom:0}
a{color:var(--blue)}
.eyebrow{font-size:12px;line-height:1;font-weight:700;letter-spacing:.13em;
  text-transform:uppercase;color:var(--blue);margin:0 0 11px}

/* top bar, on every page */
.bar{display:flex;align-items:center;justify-content:space-between;
  padding:11px var(--pad);background:var(--navy);position:sticky;top:0;z-index:9}
.bar a.home{color:#fff;text-decoration:none;font-size:13px;font-weight:700;
  letter-spacing:.01em}
.bar a.home span{color:#8FA2FF}
.bar a.buy{background:var(--blue);color:#fff;text-decoration:none;font-size:13px;
  font-weight:700;padding:9px 14px;border-radius:2px}

.hero{background:var(--navy);color:#fff;padding:28px 0 32px}
.hero h1,.hero h2{color:#fff}
.hero .kicker{font-size:12px;line-height:1;font-weight:700;letter-spacing:.13em;
  text-transform:uppercase;color:#8FA2FF;margin:0 0 13px}
.hero .sub{font-size:18px;line-height:1.4;font-weight:500;color:#C9D2F5;margin:12px 0 0}
.facts{display:flex;flex-direction:column;gap:7px;margin:22px 0 0;
  font-size:16px;line-height:1.35;font-weight:600;color:#fff}
.facts span{display:flex;gap:10px;align-items:baseline}
.facts b{color:#8FA2FF;font-weight:700;flex:0 0 54px;font-size:12px;
  letter-spacing:.08em;text-transform:uppercase}
.cta{display:block;margin:22px 0 0;background:var(--blue);color:#fff;
  text-align:center;text-decoration:none;font-size:17px;line-height:1;
  font-weight:700;padding:18px;border-radius:2px}
.cta.ghost{background:transparent;color:#fff;border:2px solid #3B54F5;
  margin-top:10px;padding:16px}
.cta.dark{background:var(--navy)}
.ebdays{font-weight:800}
.urg{margin:15px 0 0;font-size:14px;line-height:1.4;font-weight:600;color:var(--amber)}

.thesis{font-size:23px;line-height:1.32;font-weight:800;color:var(--blue);
  margin:0 0 18px;letter-spacing:-.02em}
.thesis span{display:block}

.day{border-left:3px solid var(--blue);padding:2px 0 2px 15px;margin:0 0 20px}
.day .d{font-size:12px;line-height:1;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--blue);margin-bottom:6px}
.day p{font-size:16px;margin:5px 0 0}
.day.p{border-left-color:var(--purple)}
.day.p .d{color:var(--purple)}

.host{display:flex;gap:14px;align-items:center;margin:0 0 24px}
.host img{width:64px;height:64px;border-radius:50%;object-fit:cover;flex:0 0 64px}
.host b{display:block;color:var(--navy);font-size:17px;font-weight:700;line-height:1.3}
.host span{font-size:15px;line-height:1.4}
.faces{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 12px;margin:0 0 24px}
/* Home carries every speaker at list density: four up, small, names only.
   The speakers page keeps the large portraits with company. */
.faces.mini{grid-template-columns:repeat(4,1fr);gap:14px 8px}
.faces.mini figcaption{margin-top:6px;font-size:11px;line-height:1.2;font-weight:600}
.faces figure{margin:0;text-align:center}
.faces img{width:100%;aspect-ratio:1;border-radius:50%;object-fit:cover;display:block}
.faces figcaption{margin-top:8px;font-size:13px;line-height:1.25;font-weight:700;
  color:var(--navy)}
.faces em{display:block;font-size:12px;line-height:1.25;font-style:normal;
  font-weight:400;color:var(--ink);margin-top:2px}
.names{columns:2;column-gap:16px;margin:0;padding:0;list-style:none}
.names li{break-inside:avoid;margin:0 0 11px;font-size:14px;line-height:1.25;
  font-weight:600;color:var(--navy)}
.names em{display:block;font-size:13px;line-height:1.2;font-style:normal;
  font-weight:400;color:var(--ink);margin-top:1px}
.roster{margin:0;padding:0;list-style:none}
.roster li{border-bottom:1px solid var(--line);padding:12px 0}
.roster li:last-child{border-bottom:0}
.roster b{display:block;color:var(--navy);font-size:16px;font-weight:700;line-height:1.3}
.roster span{font-size:14px;line-height:1.35;display:block;margin-top:2px}
.more{margin:18px 0 0;font-size:15px;line-height:1.45}

ul.for,ul.bul{margin:0;padding:0 0 0 18px}
.for li,.bul li{margin:0 0 11px;font-size:16px;line-height:1.45}
.for b{color:var(--navy);font-weight:700}

.tier{border:1px solid var(--line);border-left:3px solid var(--blue);
  padding:16px;margin:0 0 12px}
.tier .th{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.tier b{color:var(--navy);font-size:17px;font-weight:700;line-height:1.25}
.tier .when{font-size:13px;color:var(--ink);font-weight:400;display:block;margin-top:3px}
.tier .p{color:var(--blue);font-size:22px;line-height:1;font-weight:800;white-space:nowrap}
.tier .vip{font-size:13px;margin-top:9px;color:var(--ink)}
.tier ul{margin:11px 0 0;padding:0 0 0 17px}
.tier li{font-size:14px;line-height:1.4;margin:0 0 5px}
.note{font-size:14px;line-height:1.45;margin-top:16px}
.callout{background:var(--ice);border-left:3px solid var(--purple);
  padding:14px 15px;margin:18px 0 0;font-size:15px;line-height:1.45}
.callout b{color:var(--purple)}

.brand{margin:0 0 26px}
.brand h3{color:var(--blue);font-size:19px}
.brand .n{font-size:13px;color:var(--ink);margin:2px 0 10px}
.brand ul{margin:0;padding:0;list-style:none}
.brand li{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);
  font-size:15px;line-height:1.3}
.brand li:last-child{border-bottom:0}
.brand li i{font-style:normal;color:var(--ink);font-size:13px;flex:0 0 38px;
  font-weight:600;padding-top:1px}
.brand li b{color:var(--navy);font-weight:600}

.keep{background:var(--ice)}
.keep h2{margin-bottom:8px}
.keep p{font-size:16px}
.keep .cta{background:var(--navy)}
/* Lauren, 13 Aug: "The blue on black is terrible" and "why did the color type
   disappear in some places". The brand blue is a dark blue. On the near-black
   hero and sticky bar it sat at roughly 2:1 against the ground, under the 4.5:1
   readable floor, so small labels looked like they were fading out. On dark
   grounds only, lift it to a tint that clears the floor. Blue on white is
   unchanged. */
.hero .kicker,.bar .home span{color:#8FA6FF}
.hero .facts b{color:#9DB2FF}
.bar{background:#0B1220}

.spon{background:var(--ice)}
.spon .tier-lab{font-size:11px;font-weight:700;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink);margin:22px 0 12px;text-align:center}
.spon .tier-lab:first-of-type{margin-top:0}
.spon .pres{text-align:center}
/* Lauren, 13 Aug: "The logos are terrible." Three separate faults, not one.
   A rigid 2 and 3 column grid left the 5th gold logo and the 4th silver logo
   orphaned hard left. Crexendo's artwork has a white background, so it showed
   as a visible white rectangle floating on the grey. And sizing purely by area
   let TR's solid red square read far heavier than Phound's wordmark.
   A centred flex of equal white tiles fixes all three: the last row centres,
   every logo sits on the same white ground so no one card looks pasted on,
   and the tile carries the visual weight instead of the artwork. */
.spon .pres,.spon .g,.spon .s{display:flex;flex-wrap:wrap;justify-content:center;
  gap:10px;padding:0}
.spon .tile{background:#fff;border-radius:12px;display:flex;align-items:center;
  justify-content:center;box-shadow:0 1px 3px rgba(16,24,40,.09)}
.spon .pres .tile{width:100%;height:128px}
.spon .g .tile{width:calc(50% - 5px);height:92px}
.spon .s .tile{width:calc(33.333% - 7px);height:74px}
/* Lauren asked for logos the same size. Different marks have wildly
   different aspect ratios, so give every one an identical box and let
   object-fit centre the artwork inside it. */
.spon img{width:auto;max-width:78%;object-fit:contain;display:block}

.ps{background:var(--ice);text-align:center}
.ps img{max-width:186px;height:auto}
.end{background:var(--navy);color:#C9D2F5;text-align:center}
.end h2{color:#fff}
.end p{font-size:16px;line-height:1.5}

nav.tabs{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);
  background:#fff}
nav.tabs a{padding:14px 2px;text-align:center;font-size:12px;font-weight:700;
  color:var(--ink);text-decoration:none;border-right:1px solid var(--line);
  line-height:1.2}
nav.tabs a:last-child{border-right:0}
nav.tabs a[aria-current]{color:var(--blue);box-shadow:inset 0 -3px 0 var(--blue)}

.spon img.lg-888voip{height:73px;max-height:76%}
.spon img.lg-grandstream{height:43px;max-height:76%}
.spon img.lg-alianza{height:31px;max-height:76%}
.spon img.lg-crexendo{height:48px;max-height:76%}
.spon img.lg-carrierx{height:32px;max-height:76%}
.spon img.lg-vconic{height:34px;max-height:76%}
.spon img.lg-phound{height:24px;max-height:76%}
.spon img.lg-the-vcon-foundation{height:44px;max-height:76%}
.spon img.lg-fornix{height:44px;max-height:76%}
.spon img.lg-technology-reseller-news{height:44px;max-height:76%}</style></head><body>
