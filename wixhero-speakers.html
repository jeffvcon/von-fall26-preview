<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>speakers hero</title>
<style>
html,body{margin:0;padding:0;overflow-x:hidden}

/* ==========================================================================
   FALL '26 // WIX CUT
   Everything here is buildable in the classic Wix Editor they already have.
   Constraints honoured deliberately:
     - 980px content column (Wix classic default site width)
     - full-bleed strips with the column inside - the native Wix structure
     - every card grid is uniform, because a CMS repeater repeats ONE design
     - motion lives only inside Embed HTML blocks, never on native elements
   Brand blue #1438F1 sampled from the live vonevolution.com.
   ========================================================================== */
:root{
  --blue:#1438F1; --blue-lift:#3A57FF; --blue-deep:#0B1E7A;
  --navy:#061034; --sky:#AFC0FF; --ice:#EEF1FE; --white:#FFF; --rule:#D3DBF8;
  --display:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --col:980px;
}
*,*::before,*::after{box-sizing:border-box}
html{overflow-x:hidden;scroll-behavior:smooth}
body{margin:0;background:var(--ice);color:var(--navy);font-family:var(--display);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
h1,h2,h3,h4{margin:0;font-weight:800;letter-spacing:-.035em;line-height:1.05}
a{color:inherit}

/* a Wix "strip": full-bleed band, fixed-width column inside */
.strip{position:relative;width:100%}
.col{max-width:var(--col);margin:0 auto;padding:0 20px}
.pad{padding:clamp(38px,5vw,72px) 0}
.blue{background:var(--blue);color:var(--white)}
.ice{background:var(--ice);color:var(--navy)}
.navy{background:var(--navy);color:var(--white)}
.mono{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:500}
.blue .mono{color:var(--sky)} .ice .mono{color:var(--blue)}
.eyebrow{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.eyebrow::after{content:"";flex:1;height:1px;background:currentColor;opacity:.3}
h2.sec{font-size:clamp(26px,3.8vw,42px);letter-spacing:-.04em}
.lede{font-size:16.5px;line-height:1.6;max-width:62ch;margin:14px 0 0}
.blue .lede{color:var(--sky)}

.btn{display:inline-flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;padding:13px 20px;border-radius:2px;text-decoration:none;border:1.5px solid var(--white);color:var(--white);transition:.15s}
.btn.solid{background:var(--white);color:var(--blue)}
.btn:hover{opacity:.85}
.ice .btn{border-color:var(--blue);color:var(--blue)}
.ice .btn.solid{background:var(--blue);color:var(--white)}

/* ---------- header ---------- */
.hdr{background:var(--blue);border-bottom:1px solid var(--blue-deep);position:sticky;top:0;z-index:50}
.hdr .col{display:flex;align-items:center;gap:18px;height:58px}
.hdr img{height:25px;width:auto}
.hdr .nm{padding-left:12px;border-left:1px solid rgba(255,255,255,.35);font-weight:800;font-size:14px;color:#fff;margin-right:auto}
.hdr nav{display:flex;gap:18px}
.hdr nav a{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--sky);text-decoration:none}
.hdr nav a:hover{color:#fff}
@media (max-width:760px){.hdr nav{display:none}}

/* ---------- hero ---------- */
.hero{background:var(--blue);color:#fff;position:relative;overflow:hidden}
.hero .col{position:relative;z-index:2;padding-top:clamp(34px,4.6vw,58px);padding-bottom:clamp(28px,3.6vw,44px)}
.hero-photo{position:absolute;inset:0;z-index:0}
.hero-photo img{width:100%;height:100%;object-fit:cover;opacity:.14;filter:grayscale(1)}
.hero-photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,56,241,.76),var(--blue))}
.hgrid{display:grid;grid-template-columns:1fr auto;gap:30px;align-items:start}
@media (max-width:820px){.hgrid{grid-template-columns:1fr}}
.tags{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:20px}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;padding:6px 10px;border:1px solid rgba(255,255,255,.45);border-radius:2px}
.tag.fill{background:#fff;color:var(--blue);border-color:#fff;font-weight:700}
h1.t{font-size:clamp(32px,5.4vw,58px);letter-spacing:-.045em;line-height:.98;max-width:15ch}
h1.t small{display:block;font-size:.36em;color:var(--sky);letter-spacing:.02em;margin-bottom:.7em;font-weight:800}
.sub{margin:16px 0 0;font-size:17px;color:var(--sky);max-width:32ch}
.cta{display:flex;flex-wrap:wrap;gap:9px;margin-top:24px}
.dcard{border:1px solid rgba(255,255,255,.42);border-radius:3px;background:rgba(6,16,52,.3);padding:16px 18px 14px;min-width:212px}
.dcard .m{font-family:var(--mono);font-size:9.5px;letter-spacing:.17em;text-transform:uppercase;color:var(--sky);padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,.28)}
.dcard .d{display:flex;gap:12px;align-items:baseline;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.16)}
.dcard .d b{font-size:26px;letter-spacing:-.05em;min-width:58px;font-variant-numeric:tabular-nums}
.dcard .d span{font-size:12.5px;line-height:1.4;color:var(--sky)}
.dcard .f{padding-top:11px;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--sky);line-height:1.6}

/* ---------- embed placeholders (real iframes in Wix) ---------- */
.embed{position:relative;width:100%;overflow:hidden;background:var(--blue)}
.embed canvas{display:block;width:100%;height:100%}

#cdWrap{height:104px;background:var(--blue);display:flex;align-items:center}
.cd{max-width:var(--col);margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:26px;width:100%;flex-wrap:wrap}
.cd .lab{font-family:var(--mono);font-size:10px;letter-spacing:.17em;text-transform:uppercase;color:var(--sky);line-height:1.6}
.cd .lab b{display:block;color:#fff;font-size:12px}
.cd .clk{display:flex;gap:14px}
.cd .u{text-align:center;min-width:52px}
.cd .u .n{font-size:30px;font-weight:800;letter-spacing:-.04em;line-height:1;color:#fff;font-variant-numeric:tabular-nums;display:block}
.cd .u .x{font-family:var(--mono);font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--sky);margin-top:5px;display:block}
.cd .go{margin-left:auto;font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;background:#fff;color:var(--blue);padding:12px 18px;border-radius:2px;text-decoration:none}

/* ---------- uniform card grids (repeater-shaped) ---------- */
.rep{display:grid;gap:14px;margin-top:26px}
.rep.c3{grid-template-columns:repeat(3,1fr)}
.rep.c5{grid-template-columns:repeat(5,1fr)}
.rep.c4{grid-template-columns:repeat(4,1fr)}
@media (max-width:900px){.rep.c5{grid-template-columns:repeat(3,1fr)}.rep.c4{grid-template-columns:repeat(2,1fr)}.rep.c3{grid-template-columns:1fr}}
@media (max-width:560px){.rep.c5{grid-template-columns:repeat(2,1fr)}}

.card{background:rgba(6,16,52,.22);border:1px solid rgba(255,255,255,.3);border-radius:3px;padding:18px;display:flex;flex-direction:column;gap:8px}
.card .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--sky)}
.card h4{font-size:18px;letter-spacing:-.03em;line-height:1.14}
.card p{margin:0;font-size:13.5px;line-height:1.55;color:var(--sky)}

.pcard{background:var(--white);border:1px solid var(--rule);border-radius:3px;padding:14px}
.pcard .ph{aspect-ratio:1;overflow:hidden;border-radius:2px;background:var(--rule);position:relative}
.pcard .ph img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.1)}
.pcard .ph::after{content:"";position:absolute;inset:0;background:var(--blue);mix-blend-mode:color;opacity:.7}
.pcard b{display:block;margin-top:10px;font-size:14px;letter-spacing:-.025em;line-height:1.15}
.pcard span{display:block;margin-top:2px;font-size:11.5px;color:#4E5A82;line-height:1.3}
.pcard em{display:block;margin-top:5px;font-style:normal;font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--blue)}

.logo{background:#fff;border:1px solid var(--rule);border-radius:3px;aspect-ratio:16/9;display:grid;place-items:center;padding:16px}
.logo img{max-height:42px;width:auto;object-fit:contain}

.acard{background:var(--white);border:1px solid var(--rule);border-radius:3px;padding:20px 18px 22px}
.acard .ic{display:block;width:36px;height:36px;color:var(--blue);margin-bottom:12px}
.acard h4{font-size:15.5px;letter-spacing:-.025em;margin-bottom:7px;line-height:1.2}
.acard p{margin:0;font-size:13px;line-height:1.55;color:#3D4A73}

.ecard{background:var(--white);border:1px solid var(--rule);border-radius:3px;padding:13px 15px}
.ecard .y{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;color:#6B77A0}
.ecard b{display:block;margin-top:5px;font-size:13.5px;letter-spacing:-.02em;line-height:1.22}
.ecard em{display:block;margin-top:4px;font-style:normal;font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--blue)}

.finale{text-align:center}
.finale h2{max-width:20ch;margin:0 auto;font-size:clamp(26px,4.4vw,44px);letter-spacing:-.04em}
.finale .row{display:flex;gap:9px;justify-content:center;margin-top:24px;flex-wrap:wrap}
footer{background:var(--navy);color:var(--sky);padding:22px 0 28px}
footer .col{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:center}
footer a{text-decoration:none;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase}

/* ==========================================================================
   "HOW IT'S BUILT IN WIX" overlay - the part that matters in the meeting
   ========================================================================== */
#wixToggle{
  position:fixed;right:14px;bottom:14px;z-index:200;cursor:pointer;
  font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  background:var(--navy);color:#fff;border:2px solid var(--navy);padding:12px 16px;border-radius:2px;
  box-shadow:0 10px 30px -12px rgba(6,16,52,.6);
}
#wixToggle[aria-pressed="true"]{background:#0FBF6A;border-color:#0FBF6A;color:#04250F}
[data-wix]{position:relative}
body.showwix [data-wix]{outline:2px dashed #0FBF6A;outline-offset:5px}
body.showwix [data-wix]::before{
  content:attr(data-wix);position:absolute;left:0;top:-6px;transform:translateY(-100%);
  font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  background:#0FBF6A;color:#04250F;padding:4px 8px;border-radius:2px;white-space:nowrap;z-index:60;pointer-events:none;
}
.note{display:none;margin:0 0 18px;padding:11px 14px;border:1px dashed #0FBF6A;border-radius:3px;
  background:rgba(15,191,106,.1);font-family:var(--mono);font-size:11px;line-height:1.6}
body.showwix .note{display:block}
.curated{margin:14px 0 0;font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#fff;font-weight:500}
.curated b{font-weight:800;letter-spacing:.06em}
.curator{display:flex;gap:clamp(20px,3.4vw,44px);align-items:center}
.curator img{width:clamp(110px,15vw,170px);height:clamp(110px,15vw,170px);border-radius:50%;object-fit:cover;flex-shrink:0;border:3px solid var(--blue)}
@media (max-width:680px){.curator{flex-direction:column;align-items:flex-start}
  .curator img{width:110px!important;height:110px!important;border-width:3px!important}}
.hook{margin:0 0 20px;font-size:clamp(15px,1.7vw,18.5px);line-height:1.45;font-weight:700;color:#fff;max-width:34ch;border-left:3px solid rgba(255,255,255,.55);padding-left:14px}
.hook span{display:block;font-weight:500;color:var(--sky);margin-top:4px}
.tracks{display:grid;grid-template-columns:1fr auto 1fr;gap:0 clamp(14px,2vw,26px);align-items:start;margin-top:26px}
@media (max-width:860px){.tracks{grid-template-columns:1fr}}
.tracklane{border:1px solid rgba(255,255,255,.32);border-radius:3px;background:rgba(6,16,52,.24);padding:20px}
.trackhead{padding-bottom:14px;margin-bottom:6px;border-bottom:1px solid rgba(255,255,255,.28)}
.tk{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--sky);display:block;margin-bottom:7px}
.trackhead h3{font-size:clamp(19px,2.4vw,26px);letter-spacing:-.03em;line-height:1.1}
.slotrow{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.14)}
.slotrow:last-child{border-bottom:0;padding-bottom:0}
.slotrow .tm{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--sky);flex:0 0 62px;padding-top:3px}
.slotrow b{display:block;font-size:15.5px;letter-spacing:-.02em;line-height:1.2;color:#fff}
.slotrow p{margin:5px 0 0;font-size:13.5px;line-height:1.55;color:var(--sky)}
.slotrow .cap{display:inline-block;margin-top:9px;font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;background:#fff;color:var(--blue);padding:5px 9px;border-radius:2px}
.parallel{display:flex;align-items:center;justify-content:center;align-self:stretch;position:relative}
.parallel span{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--sky);writing-mode:vertical-rl;transform:rotate(180deg);padding:10px 0;border-left:1px dashed rgba(255,255,255,.35);border-right:1px dashed rgba(255,255,255,.35);height:100%;display:flex;align-items:center;justify-content:center}
@media (max-width:860px){.parallel span{writing-mode:horizontal-tb;transform:none;border:0;border-top:1px dashed rgba(255,255,255,.35);border-bottom:1px dashed rgba(255,255,255,.35);width:100%;height:auto;padding:9px 0;margin:12px 0}}
.offer{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:26px}
@media (max-width:820px){.offer{grid-template-columns:1fr}}
.obox{background:#fff;border:1px solid var(--rule);border-left:4px solid var(--blue);border-radius:3px;padding:20px}
.obox.hot{border-left-color:#0FBF6A}
.on{font-family:var(--mono);font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:#6B77A0;display:block;margin-bottom:9px}
.obox b{display:block;font-size:21px;letter-spacing:-.03em;line-height:1.1;color:var(--navy)}
.obox p{margin:8px 0 0;font-size:14px;line-height:1.55;color:#3D4A73}
.nextup{display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between;margin-top:20px;padding:18px 20px;background:#fff;border:1px dashed var(--blue);border-radius:3px}
.nextup b{display:block;font-size:19px;letter-spacing:-.03em;margin-top:6px;color:var(--navy)}
.nextup .wh{display:block;font-size:14px;color:#3D4A73;margin-top:3px}
.subwrap{display:grid;grid-template-columns:1fr 1fr;gap:clamp(22px,4vw,54px);align-items:center}
@media (max-width:820px){.subwrap{grid-template-columns:1fr}}
.subform label{display:block;margin-bottom:9px}
.subrow{display:flex;gap:9px;flex-wrap:wrap}
.subrow input{flex:1;min-width:190px;padding:14px 15px;border-radius:2px;border:1px solid rgba(255,255,255,.42);background:rgba(255,255,255,.08);color:#fff;font-size:15px;font-family:inherit}
.subrow input::placeholder{color:#8FA0D8}
.subrow input:focus{outline:2px solid #fff;outline-offset:1px}
.subnote{display:block;margin-top:10px;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--sky)}

/* ---- final polish pass ---- */
h1.t{font-size:clamp(34px,6vw,66px);letter-spacing:-.05em}
h2.sec{font-size:clamp(28px,4.2vw,46px)}
.strip.hero .col{padding-bottom:clamp(34px,4.4vw,54px)}
.venue img{transition:transform .6s cubic-bezier(.2,.7,.3,1)}
.venue:hover img{transform:scale(1.03)}
.card,.obox,.pcard,.spo,.acard,.ecard,.tracklane{transition:transform .2s,box-shadow .2s,border-color .2s}
.pcard:hover,.spo:hover,.ecard:hover{transform:translateY(-3px);box-shadow:0 16px 34px -22px rgba(6,16,52,.55)}
.obox:hover{transform:translateY(-3px);box-shadow:0 18px 38px -22px rgba(6,16,52,.4)}
.card:hover{border-color:rgba(255,255,255,.55)}
.eyebrow{margin-bottom:14px}
.eyebrow .mono{font-weight:700}
.pad{padding:clamp(46px,5.6vw,84px) 0}
/* the numbers people scan for */
.dcard .d b,.cd .u .n,.slotrow .cap{font-feature-settings:"tnum"}
.hook{font-size:clamp(15px,1.75vw,19px);border-left-width:4px}
/* speakers: colour on hover reads as a room full of real people */
.pcard .ph::after{transition:opacity .45s cubic-bezier(.2,.7,.3,1)}
.spk-grid,.rep{align-items:stretch}
.obox b{font-size:22px}
.trackhead h3{font-size:clamp(20px,2.5vw,28px)}
footer{padding:30px 0 40px}

/* ==========================================================================
   ACCESSIBILITY PASS
   1. Contrast. #AFC0FF on #1438F1 measured 4.12:1 and fails WCAG AA for body
      text. Raised to #DDE4FF (5.80:1). #6B77A0 on white measured 4.40:1 and
      is replaced by #4E5A82 (6.76:1).
   2. Type size. Base 16px -> 18px and every small style raised with it. The
      audience is senior. Nothing on this page should need squinting.
   ========================================================================== */
:root{ --sky:#DDE4FF; }

body{font-size:18px;line-height:1.65}
.mono{font-size:12.5px;letter-spacing:.14em}
.lede{font-size:19px;line-height:1.62}
.prose p{font-size:18.5px;line-height:1.7}

/* hero */
.hook{font-size:clamp(17px,1.9vw,21px);line-height:1.5}
.tag{font-size:12px;letter-spacing:.11em;padding:8px 12px}
.sub{font-size:19px}
.curated{font-size:13.5px}
.dcard .m{font-size:11.5px}
.dcard .d b{font-size:32px}
.dcard .d span{font-size:15px;line-height:1.45}
.dcard .f{font-size:11.5px}

/* buttons */
.btn{font-size:13px;padding:14px 20px;letter-spacing:.1em}
.btn.solid{font-weight:800}
.hdr nav a{font-size:12.5px}
.hdr .nm{font-size:16px}

/* countdown */
.cd .lab{font-size:12px}
.cd .lab b{font-size:14px}
.cd .u .n{font-size:34px}
.cd .u .x{font-size:11px}
.cd .go{font-size:12.5px;padding:14px 20px}

/* cards + tracks */
.card .k{font-size:11.5px}
.card h4{font-size:20px}
.card p{font-size:16px;line-height:1.6}
.tk{font-size:11.5px}
.slotrow .tm{font-size:11.5px;flex-basis:74px}
.slotrow b{font-size:17.5px}
.slotrow p{font-size:15.5px;line-height:1.6}
.slotrow .cap{font-size:11.5px;padding:6px 10px}

/* audience */
.aud-full h4{font-size:19px}
.aud-full p{font-size:16px;line-height:1.62;color:#3D4A73}
.acard h4{font-size:17px}
.acard p{font-size:15.5px;color:#3D4A73}

/* expect */
ul.exp li{font-size:17.5px;padding:13px 0}
.topic{font-size:12.5px;padding:9px 13px}

/* membership */
.on{font-size:11.5px;color:#4E5A82}
.obox b{font-size:24px}
.obox p{font-size:16px;color:#3D4A73}
.nextup b{font-size:21px}
.nextup .wh{font-size:16px;color:#3D4A73}

/* speakers + past events */
.pcard b{font-size:16px}
.pcard span{font-size:14px;color:#4E5A82;line-height:1.4}
.pcard em{font-size:11px;letter-spacing:.11em}
.ecard .y{font-size:11.5px;color:#4E5A82}
.ecard b{font-size:15.5px}
.ecard em{font-size:10.5px}

/* subscribe */
.subrow input{font-size:17px;padding:16px 16px}
.subnote{font-size:11.5px}
.subform label{font-size:12.5px}

/* quote */
.quote .who{font-size:16px}
.quote .who b{font-size:17px}
.quote .who em{font-size:11.5px}

footer a,footer .mono{font-size:12.5px}

/* ==========================================================================
   LARGE-TYPE PASS - target reader is 72, not 40.
   Body 20px, generous leading, no body copy below 16px anywhere, and the
   uppercase mono labels get weight and looser leading so they stay legible
   at small optical size. Header trimmed to four links so nothing wraps.
   ========================================================================== */
body{font-size:20px;line-height:1.7}
.lede{font-size:21px;line-height:1.66}
.prose p{font-size:20.5px;line-height:1.72;max-width:62ch}
.mono{font-size:13.5px;letter-spacing:.12em;font-weight:700}

.hdr .col{height:auto;min-height:66px;padding-top:8px;padding-bottom:8px;flex-wrap:wrap}
.hdr nav{gap:22px;flex-wrap:wrap}

/* ==========================================================================
   LIGHT BASE + SEMANTIC COLOUR  (2026 direction)
   Blue no longer carries the page. Off-white ground, and four accents that
   each mean something rather than decorate:
     blue   = the brand, primary action
     purple = the vCon Summit track
     yellow = VoiceAI LIVE!  (fill only - 1.47:1 as text, 12.07:1 under ink)
     green  = membership / the Foundation (fill only - 3.36:1 as text)
   ========================================================================== */
:root{
  --paper:#FAFAF8; --card:#FFFFFF; --ink:#0E1320; --ink2:#47506B;
  --blue:#1438F1; --purple:#5B2ED6; --yellow:#FFC93D; --green:#0B9D5B;
  --line:#E3E4E8; --rule:#E3E4E8;
}
body{background:var(--paper);color:var(--ink);font-weight:500}
.ice,.strip.ice{background:var(--paper);color:var(--ink)}
.strip.blue{background:var(--card);color:var(--ink)}
.strip.blue .mono{color:var(--blue)}
.strip.blue .lede,.strip.blue .prose p{color:var(--ink2)}
.strip.blue h2.sec,.strip.blue h4,.strip.blue b{color:var(--ink)}

/* header: white, not a blue slab */
.hdr{background:var(--card);border-bottom:2px solid var(--line)}
.hdr .nm{color:var(--ink);border-left-color:var(--line)}
.hdr img{filter:brightness(0)}
.hdr nav a{color:var(--ink2)}
.hdr nav a:hover{color:var(--blue)}

/* hero: light, photo does the work */
.hero{background:var(--paper);color:var(--ink)}
.hero-photo{display:none}
.hook{color:var(--ink);border-left:5px solid var(--blue)}
.hook span{color:var(--ink2)}
h1.t{color:var(--ink)} h1.t small{color:var(--blue)}
.sub{color:var(--ink2)}
.curated{color:var(--ink)}
.tag{border:2px solid var(--ink);color:var(--ink)}
.tag.fill{background:var(--blue);border-color:var(--blue);color:#fff}
.dcard{background:var(--card);border:2px solid var(--line)}
.dcard .m{color:var(--blue);border-bottom-color:var(--line)}
.dcard .d{border-bottom-color:var(--line)}
.dcard .d b{color:var(--blue)} .dcard .d span{color:var(--ink2)}
.dcard .f{color:var(--ink2)}
.venue{border:2px solid var(--line)}
.venue figcaption{background:var(--ink);color:#fff}

/* buttons: bigger, bolder, unmissable */
.btn{font-size:19px;font-weight:800;padding:20px 30px;border-width:3px;border-radius:3px;letter-spacing:.04em}
.btn{border-color:var(--blue);color:var(--blue);background:var(--card)}
.btn.solid{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn:hover{background:var(--blue);color:#fff}
.btn.solid:hover{background:var(--purple);border-color:var(--purple)}

/* countdown: DOORS OPEN doubled and bold */
#cdWrap{background:var(--ink)}
.cd .lab{font-size:30px;font-weight:800;letter-spacing:-.02em;text-transform:none;color:#fff;line-height:1.15}
.cd .lab b{font-size:19px;font-weight:600;color:var(--yellow);letter-spacing:.02em;margin-top:4px}
.cd .u .n{color:var(--yellow);font-size:46px}
.cd .u .x{color:#C9CEDD}
.cd .go{background:var(--yellow);color:var(--ink);font-weight:800;font-size:18px;padding:18px 26px}

/* conversation band keeps its dark ground so the canvas reads */
#bandWrap{background:var(--ink)}

/* why this room: four accents, one per card */
.strip.navy#why{background:var(--paper);color:var(--ink)}
#why h2.sec{color:var(--ink)}
#why .mono{color:var(--blue)!important}
#why .card{background:var(--card);border:2px solid var(--line);border-top:7px solid var(--blue)}
#why .card:nth-child(2){border-top-color:var(--purple)}
#why .card:nth-child(3){border-top-color:var(--yellow)}
#why .card:nth-child(4){border-top-color:var(--green)}
#why .card .k{color:var(--ink2)} #why .card h4{color:var(--ink)} #why .card p{color:var(--ink2)}

/* program: Track A purple, Track B yellow */
.tracklane{background:var(--card);border:2px solid var(--line);border-top:7px solid var(--purple)}
.tracks .tracklane:last-of-type{border-top-color:var(--yellow)}
.tk{color:var(--ink2)} .trackhead h3{color:var(--ink)} .trackhead{border-bottom-color:var(--line)}
.slotrow{border-bottom-color:var(--line)}
.slotrow .tm{color:var(--purple)} .slotrow b{color:var(--ink)} .slotrow p{color:var(--ink2)}
.tracks .tracklane:last-of-type .slotrow .tm{color:#8A6200}
.slotrow .cap{background:var(--yellow);color:var(--ink);font-weight:800}
.tracklane:first-of-type .slotrow .cap{background:var(--purple);color:#fff}
.parallel span{color:var(--ink2);border-color:var(--line)}
#program .card{background:var(--card);border:2px solid var(--line)}
#program .card .k{color:var(--ink2)} #program .card h4{color:var(--ink)} #program .card p{color:var(--ink2)}

/* membership: green is the money colour */
#join .obox{border:2px solid var(--line);border-left:7px solid var(--blue)}
#join .obox:nth-child(2){border-left-color:var(--purple)}
#join .obox.hot{border-left-color:var(--green)}
#join .nextup{border:3px dashed var(--green);background:var(--card)}
#join .nextup .mono{color:var(--green)!important}

/* doors: one colour each */
#door{background:var(--paper);color:var(--ink)}
#door h2.sec{font-size:clamp(38px,5.6vw,64px);color:var(--ink)}
#door .lede{color:var(--ink2)}
#door .mono{color:var(--blue)!important}
#door .card{background:var(--card);border:2px solid var(--line);border-top:7px solid var(--blue)}
#door .card:nth-child(2){border-top-color:var(--yellow)}
#door .card:nth-child(3){border-top-color:var(--purple)}
#door .card:nth-child(4){border-top-color:var(--green)}
#door .card .k{color:var(--ink2)} #door .card h4{color:var(--ink);font-size:26px} #door .card p{color:var(--ink2)}

/* speakers in full colour - warmth, and less blue */
.pcard{border:2px solid var(--line)}
.pcard .ph::after{display:none}
.pcard .ph img{filter:none}
.pcard b{color:var(--ink)} .pcard span{color:var(--ink2)} .pcard em{color:var(--blue)}
.spo{border:2px solid var(--line)}
.ecard{border:2px solid var(--line)} .ecard b{color:var(--ink)} .ecard em{color:var(--purple)} .ecard .y{color:var(--ink2)}
.acard,.aud-full article{border-top-color:var(--blue)}
.aud-full p,.acard p{color:var(--ink2)}
.aud-full .ic{color:var(--blue)}
.topic{background:var(--card);border:2px solid var(--line);color:var(--ink)}
ul.exp li{border-bottom-color:var(--line);color:var(--ink)}
ul.exp li::before{background:var(--green)}
.quote{border-left:5px solid var(--purple)}
.quote q{color:var(--ink)} .quote .who{color:var(--ink2)} .quote .who b{color:var(--ink)} .quote .who em{color:var(--purple)}
.eyebrow::after{background:var(--line);opacity:1}

/* the two dark moments left on the page */
.strip.navy#subscribe{background:var(--ink)}
#subscribe h2.sec{color:#fff} #subscribe .lede{color:#C9CEDD}
#subscribe .subform label{color:var(--yellow)} #subscribe .subnote{color:#C9CEDD}
#subscribe .btn.solid{background:var(--yellow);color:var(--ink);border-color:var(--yellow)}
.finale{background:var(--ink)} .finale h2{color:#fff} .finale .lede{color:#C9CEDD}
.finale .btn{background:transparent;color:#fff;border-color:#fff}
.finale .btn.solid{background:var(--yellow);color:var(--ink);border-color:var(--yellow)}
footer{background:var(--ink);color:#C9CEDD} footer a{color:#C9CEDD} footer a:hover{color:var(--yellow)}

/* no thin grey anywhere */
.lede,.prose p,.card p,.slotrow p,.aud-full p,.acard p,.obox p,.pcard span,.ecard b{font-weight:500}
.mono{font-weight:800}

/* ==========================================================================
   ASSISTIVE PASS - the audience includes many visually impaired people.
   Targets WCAG AAA (7:1) for body copy, not just AA.
   ========================================================================== */
.skiplink{position:absolute;left:-9999px;top:0;z-index:999;background:#0E1320;color:#fff;
  padding:16px 22px;font-weight:800;font-size:18px;border-radius:0 0 4px 0}
.skiplink:focus{left:0}

/* FIX: white text stranded on white after the light flip (was 1.0:1, invisible) */
.strip.blue .prose p strong,.strip.blue strong,.strip.blue .lede strong{color:#0E1320!important}
.strip.navy.finale h2,.strip.navy.finale h2.sec,.finale h2,.finale h2.sec{color:#FFFFFF!important}
.finale .lede,.finale p{color:#D8DCE6!important}
footer .mono,footer .cr,footer span{color:#D8DCE6!important}

/* FIX: green failed as text at 3.51:1 - only ever a fill from here on */
#join .nextup .mono{color:#0E1320!important}
#join .nextup{border-color:#0B9D5B}
.slotrow .tm{color:#3C2E8F!important}
.tracks .tracklane:last-of-type .slotrow .tm{color:#6B4A00!important}

/* AAA body copy */
.lede,.prose p,.card p,.slotrow p,.aud-full p,.obox p,.pcard span,.ecard b{color:#3A4157}
.mono{color:#3A4157}
#why .mono,#door .mono,.eyebrow .mono{color:#0F2ED0!important}
.h3,.ch{font-size:23px;letter-spacing:-.03em;line-height:1.15;margin:0;font-weight:800}
#door .ch{font-size:26px}

/* visible, unmissable focus for keyboard and low-vision users */
a:focus-visible,button:focus-visible,input:focus-visible{
  outline:4px solid #0F2ED0;outline-offset:3px;border-radius:2px;
  box-shadow:0 0 0 8px rgba(15,46,208,.22)}
.finale a:focus-visible,#subscribe a:focus-visible,#subscribe input:focus-visible,footer a:focus-visible{
  outline-color:#FFC93D;box-shadow:0 0 0 8px rgba(255,201,61,.3)}

/* respect OS settings */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  .rv{opacity:1!important;transform:none!important}
}
@media (prefers-contrast:more){
  :root{--ink:#000;--ink2:#1A1F30;--line:#000;--rule:#000}
  .card,.obox,.pcard,.spo,.ecard,.tracklane,.dcard,.venue{border-width:3px!important;border-color:#000!important}
  .btn{border-width:4px!important}
}
.on{color:#2C3347!important}

/* ==========================================================================
   ONE TYPEFACE
   Per the designer: the monospace was carrying a dozen different jobs and
   reading as many fonts. Everything is now one grotesque. Hierarchy comes
   from WEIGHT (500 / 700 / 800) and size, not from swapping families.
   ========================================================================== */
:root{ --mono:"Helvetica Neue",Helvetica,Arial,"Liberation Sans",sans-serif; }
body,.mono,.btn,.tag,.hdr nav a,.cd .lab,.cd .u .x,.card .k,.tk,.slotrow .tm,
.slotrow .cap,.on,.pcard em,.ecard .y,.ecard em,.topic,.subform label,.subnote,
.dcard .m,.dcard .f,.curated,.venue figcaption,.parallel span,.quote .who em,
footer a,footer .mono,#wixToggle,.note,.cms-note{
  font-family:"Helvetica Neue",Helvetica,Arial,"Liberation Sans",sans-serif;
}

/* labels stay labels through weight and tracking, not a different face */
.mono,.card .k,.tk,.on,.ecard .y,.dcard .m,.subform label{
  font-weight:700;letter-spacing:.08em;text-transform:uppercase;
}
.eyebrow .mono{font-weight:800;letter-spacing:.1em}
.slotrow .tm{font-weight:700;letter-spacing:.06em}
.pcard em,.ecard em,.quote .who em{font-weight:700;letter-spacing:.06em}
.tag{font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.btn{font-weight:800;letter-spacing:.03em;text-transform:uppercase}
.hdr nav a{font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.topic{font-weight:600;letter-spacing:.02em;text-transform:none}
.curated{font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.venue figcaption{font-weight:700;letter-spacing:.03em;text-transform:none}
.subnote{font-weight:600;letter-spacing:0;text-transform:none}
.dcard .f{font-weight:600;letter-spacing:.02em;text-transform:none}
.slotrow .cap{font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.parallel span{font-weight:700;letter-spacing:.1em}
footer a,footer .mono{font-weight:600;letter-spacing:.02em;text-transform:none}
#wixToggle{font-weight:800;letter-spacing:.04em}
.note,.cms-note{font-weight:500;letter-spacing:0;text-transform:none}

/* numbers keep the one thing mono was genuinely good for */
.cd .u .n,.dcard .d b,.card .k,.slotrow .tm,.ecard .y{font-variant-numeric:tabular-nums}
.cd .lab{font-weight:800;letter-spacing:-.02em;text-transform:none}
.cd .lab b{font-weight:600;letter-spacing:.02em;text-transform:none}
.cd .u .x{font-weight:700;letter-spacing:.06em;text-transform:uppercase}

/* ==========================================================================
   DESIGNER ROUND 2
   vCon purple is exactly #6A0DAD. Blue carries every bold. Colour never stops.
   ========================================================================== */
:root{ --purple:#6A0DAD; --green:#0A6E3D; --amberlbl:#8A5A00; }

/* doors-open banner is blue, not black */
#cdWrap{background:var(--blue)!important;padding:0}
/* one clock on the page. This is a marker, not a timer. */
#cdWrap .cd{min-height:0;height:auto;padding:6px 0;display:flex;justify-content:center;align-items:center}

#cdWrap .cd .lab{font-size:clamp(17px,1.9vw,20px)}
.cd .lab{color:#fff!important}
.cd .lab b{color:#fff!important;opacity:.92}
.cd .u .n{color:#fff!important}
.cd .u .x{color:#DDE4FF!important}
.cd .go{background:#fff!important;color:var(--blue)!important}

/* Jeff in colour, bigger, blue ring */
.curator img{width:clamp(150px,19vw,215px);height:clamp(150px,19vw,215px);border:5px solid var(--blue);filter:none}
.curator h2.sec,.curator .lede strong{color:var(--blue)!important}
.curator .lede{color:#0E1320}
/* every bold goes blue, small text stays black */
strong,.prose p strong,.lede strong,.aud-full h4,.acard h4,.obox b,.nextup b,.ch,.card h4,.slotrow b,.pcard b{color:var(--blue)!important}
h2.sec{color:var(--blue)!important}
.finale h2,.finale h2.sec{color:#fff!important}
#cdWrap *,.venue figcaption{color:inherit}
.venue figcaption{background:var(--blue);color:#fff!important}

/* vCon Summit = #6A0DAD */
.tracklane{border-top-color:var(--purple)!important}
.tracks .tracklane:last-of-type{border-top-color:#FFC93D!important}
.tracklane:first-of-type .trackhead h3{color:var(--purple)!important}
.tracklane:first-of-type .slotrow .tm{color:var(--purple)!important}
.tracklane:first-of-type .slotrow b{color:var(--purple)!important}
.tracklane:first-of-type .slotrow .cap{background:var(--purple)!important;color:#fff!important}
/* VoiceAI LIVE! labels in green, not yellow */
.tracks .tracklane:last-of-type .trackhead h3{color:#8A5A00!important}
.tracks .tracklane:last-of-type .slotrow .tm{color:var(--green)!important}
.tracks .tracklane:last-of-type .slotrow b{color:var(--green)!important}
.tracks .tracklane:last-of-type .slotrow .cap{background:var(--green)!important;color:#fff!important}
.parallel span{color:var(--ink2)}

/* membership gets a real box, and the Report lives inside it */
#join .col{background:#fff;border:4px solid var(--blue);border-radius:5px;padding:clamp(26px,3.4vw,46px);max-width:calc(var(--col) - 8px)}
#join .obox{border-left-color:var(--purple)}
#join .obox:nth-child(2){border-left-color:var(--blue)}

/* ==========================================================================
   LIGHT BASE + SEMANTIC COLOUR  (2026 direction)
   Blue no longer carries the page. Off-white ground, and four accents that
   each mean something rather than decorate:
     blue   = the brand, primary action
     purple = the vCon Summit track
     yellow = VoiceAI LIVE!  (fill only - 1.47:1 as text, 12.07:1 under ink)
     green  = membership / the Foundation (fill only - 3.36:1 as text)
   ========================================================================== */
:root{
  --paper:#FAFAF8; --card:#FFFFFF; --ink:#0E1320; --ink2:#47506B;
  --blue:#1438F1; --purple:#5B2ED6; --yellow:#FFC93D; --green:#0B9D5B;
  --line:#E3E4E8; --rule:#E3E4E8;
}
body{background:var(--paper);color:var(--ink);font-weight:500}
.ice,.strip.ice{background:var(--paper);color:var(--ink)}
.strip.blue{background:var(--card);color:var(--ink)}
.strip.blue .mono{color:var(--blue)}
.strip.blue .lede,.strip.blue .prose p{color:var(--ink2)}
.strip.blue h2.sec,.strip.blue h4,.strip.blue b{color:var(--ink)}

/* header: white, not a blue slab */
.hdr{background:var(--card);border-bottom:2px solid var(--line)}
.hdr .nm{color:var(--ink);border-left-color:var(--line)}
.hdr img{filter:brightness(0)}
.hdr nav a{color:var(--ink2)}
.hdr nav a:hover{color:var(--blue)}

/* hero: light, photo does the work */
.hero{background:var(--paper);color:var(--ink)}
.hero-photo{display:none}
.hook{color:var(--ink);border-left:5px solid var(--blue)}
.hook span{color:var(--ink2)}
h1.t{color:var(--ink)} h1.t small{color:var(--blue)}
.sub{color:var(--ink2)}
.curated{color:var(--ink)}
.tag{border:2px solid var(--ink);color:var(--ink)}
.tag.fill{background:var(--blue);border-color:var(--blue);color:#fff}
.dcard{background:var(--card);border:2px solid var(--line)}
.dcard .m{color:var(--blue);border-bottom-color:var(--line)}
.dcard .d{border-bottom-color:var(--line)}
.dcard .d b{color:var(--blue)} .dcard .d span{color:var(--ink2)}
.dcard .f{color:var(--ink2)}
.venue{border:2px solid var(--line)}
.venue figcaption{background:var(--ink);color:#fff}

/* buttons: bigger, bolder, unmissable */
.btn{font-size:19px;font-weight:800;padding:20px 30px;border-width:3px;border-radius:3px;letter-spacing:.04em}
.btn{border-color:var(--blue);color:var(--blue);background:var(--card)}
.btn.solid{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn:hover{background:var(--blue);color:#fff}
.btn.solid:hover{background:var(--purple);border-color:var(--purple)}

/* countdown: DOORS OPEN doubled and bold */
#cdWrap{background:var(--ink)}
.cd .lab{font-size:30px;font-weight:800;letter-spacing:-.02em;text-transform:none;color:#fff;line-height:1.15}
.cd .lab b{font-size:19px;font-weight:600;color:var(--yellow);letter-spacing:.02em;margin-top:4px}
.cd .u .n{color:var(--yellow);font-size:46px}
.cd .u .x{color:#C9CEDD}
.cd .go{background:var(--yellow);color:var(--ink);font-weight:800;font-size:18px;padding:18px 26px}

/* conversation band keeps its dark ground so the canvas reads */
#bandWrap{background:var(--ink)}

/* why this room: four accents, one per card */
.strip.navy#why{background:var(--paper);color:var(--ink)}
#why h2.sec{color:var(--ink)}
#why .mono{color:var(--blue)!important}
#why .card{background:var(--card);border:2px solid var(--line);border-top:7px solid var(--blue)}
#why .card:nth-child(2){border-top-color:var(--purple)}
#why .card:nth-child(3){border-top-color:var(--yellow)}
#why .card:nth-child(4){border-top-color:var(--green)}
#why .card .k{color:var(--ink2)} #why .card h4{color:var(--ink)} #why .card p{color:var(--ink2)}

/* program: Track A purple, Track B yellow */
.tracklane{background:var(--card);border:2px solid var(--line);border-top:7px solid var(--purple)}
.tracks .tracklane:last-of-type{border-top-color:var(--yellow)}
.tk{color:var(--ink2)} .trackhead h3{color:var(--ink)} .trackhead{border-bottom-color:var(--line)}
.slotrow{border-bottom-color:var(--line)}
.slotrow .tm{color:var(--purple)} .slotrow b{color:var(--ink)} .slotrow p{color:var(--ink2)}
.tracks .tracklane:last-of-type .slotrow .tm{color:#8A6200}
.slotrow .cap{background:var(--yellow);color:var(--ink);font-weight:800}
.tracklane:first-of-type .slotrow .cap{background:var(--purple);color:#fff}
.parallel span{color:var(--ink2);border-color:var(--line)}
#program .card{background:var(--card);border:2px solid var(--line)}
#program .card .k{color:var(--ink2)} #program .card h4{color:var(--ink)} #program .card p{color:var(--ink2)}

/* membership: green is the money colour */
#join .obox{border:2px solid var(--line);border-left:7px solid var(--blue)}
#join .obox:nth-child(2){border-left-color:var(--purple)}
#join .obox.hot{border-left-color:var(--green)}
#join .nextup{border:3px dashed var(--green);background:var(--card)}
#join .nextup .mono{color:var(--green)!important}

/* doors: one colour each */
#door{background:var(--paper);color:var(--ink)}
#door h2.sec{font-size:clamp(38px,5.6vw,64px);color:var(--ink)}
#door .lede{color:var(--ink2)}
#door .mono{color:var(--blue)!important}
#door .card{background:var(--card);border:2px solid var(--line);border-top:7px solid var(--blue)}
#door .card:nth-child(2){border-top-color:var(--yellow)}
#door .card:nth-child(3){border-top-color:var(--purple)}
#door .card:nth-child(4){border-top-color:var(--green)}
#door .card .k{color:var(--ink2)} #door .card h4{color:var(--ink);font-size:26px} #door .card p{color:var(--ink2)}

/* speakers in full colour - warmth, and less blue */
.pcard{border:2px solid var(--line)}
.pcard .ph::after{display:none}
.pcard .ph img{filter:none}
.pcard b{color:var(--ink)} .pcard span{color:var(--ink2)} .pcard em{color:var(--blue)}
.spo{border:2px solid var(--line)}
.ecard{border:2px solid var(--line)} .ecard b{color:var(--ink)} .ecard em{color:var(--purple)} .ecard .y{color:var(--ink2)}
.acard,.aud-full article{border-top-color:var(--blue)}
.aud-full p,.acard p{color:var(--ink2)}
.aud-full .ic{color:var(--blue)}
.topic{background:var(--card);border:2px solid var(--line);color:var(--ink)}
ul.exp li{border-bottom-color:var(--line);color:var(--ink)}
ul.exp li::before{background:var(--green)}
.quote{border-left:5px solid var(--purple)}
.quote q{color:var(--ink)} .quote .who{color:var(--ink2)} .quote .who b{color:var(--ink)} .quote .who em{color:var(--purple)}
.eyebrow::after{background:var(--line);opacity:1}

/* the two dark moments left on the page */
.strip.navy#subscribe{background:var(--ink)}
#subscribe h2.sec{color:#fff} #subscribe .lede{color:#C9CEDD}
#subscribe .subform label{color:var(--yellow)} #subscribe .subnote{color:#C9CEDD}
#subscribe .btn.solid{background:var(--yellow);color:var(--ink);border-color:var(--yellow)}
.finale{background:var(--ink)} .finale h2{color:#fff} .finale .lede{color:#C9CEDD}
.finale .btn{background:transparent;color:#fff;border-color:#fff}
.finale .btn.solid{background:var(--yellow);color:var(--ink);border-color:var(--yellow)}
footer{background:var(--ink);color:#C9CEDD} footer a{color:#C9CEDD} footer a:hover{color:var(--yellow)}

/* no thin grey anywhere */
.lede,.prose p,.card p,.slotrow p,.aud-full p,.acard p,.obox p,.pcard span,.ecard b{font-weight:500}
.mono{font-weight:800}

/* ==========================================================================
   ASSISTIVE PASS - the audience includes many visually impaired people.
   Targets WCAG AAA (7:1) for body copy, not just AA.
   ========================================================================== */
.skiplink{position:absolute;left:-9999px;top:0;z-index:999;background:#0E1320;color:#fff;
  padding:16px 22px;font-weight:800;font-size:18px;border-radius:0 0 4px 0}
.skiplink:focus{left:0}

/* FIX: white text stranded on white after the light flip (was 1.0:1, invisible) */
.strip.blue .prose p strong,.strip.blue strong,.strip.blue .lede strong{color:#0E1320!important}
.strip.navy.finale h2,.strip.navy.finale h2.sec,.finale h2,.finale h2.sec{color:#FFFFFF!important}
.finale .lede,.finale p{color:#D8DCE6!important}
footer .mono,footer .cr,footer span{color:#D8DCE6!important}

/* FIX: green failed as text at 3.51:1 - only ever a fill from here on */
#join .nextup .mono{color:#0E1320!important}
#join .nextup{border-color:#0B9D5B}
.slotrow .tm{color:#3C2E8F!important}
.tracks .tracklane:last-of-type .slotrow .tm{color:#6B4A00!important}

/* AAA body copy */
.lede,.prose p,.card p,.slotrow p,.aud-full p,.obox p,.pcard span,.ecard b{color:#3A4157}
.mono{color:#3A4157}
#why .mono,#door .mono,.eyebrow .mono{color:#0F2ED0!important}
.h3,.ch{font-size:23px;letter-spacing:-.03em;line-height:1.15;margin:0;font-weight:800}

/* visible, unmissable focus for keyboard and low-vision users */
a:focus-visible,button:focus-visible,input:focus-visible{
  outline:4px solid #0F2ED0;outline-offset:3px;border-radius:2px;
  box-shadow:0 0 0 8px rgba(15,46,208,.22)}

  outline-color:#FFC93D;box-shadow:0 0 0 8px rgba(255,201,61,.3)}

/* respect OS settings */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  .rv{opacity:1!important;transform:none!important}
}
@media (prefers-contrast:more){
  :root{--ink:#000;--ink2:#1A1F30;--line:#000;--rule:#000}
  .card,.obox,.pcard,.spo,.ecard,.tracklane,.dcard,.venue{border-width:3px!important;border-color:#000!important}
  .btn{border-width:4px!important}
}
.on{color:#2C3347!important}

/* ==========================================================================
   ONE TYPEFACE
   Per the designer: the monospace was carrying a dozen different jobs and
   reading as many fonts. Everything is now one grotesque. Hierarchy comes
   from WEIGHT (500 / 700 / 800) and size, not from swapping families.
   ========================================================================== */
:root{ --mono:"Helvetica Neue",Helvetica,Arial,"Liberation Sans",sans-serif; }
body,.mono,.btn,.tag,.hdr nav a,.cd .lab,.cd .u .x,.card .k,.tk,.slotrow .tm,
.slotrow .cap,.on,.pcard em,.ecard .y,.ecard em,.topic,.subform label,.subnote,
.dcard .m,.dcard .f,.curated,.venue figcaption,.parallel span,.quote .who em,
footer a,footer .mono,#wixToggle,.note,.cms-note{
  font-family:"Helvetica Neue",Helvetica,Arial,"Liberation Sans",sans-serif;
}

/* labels stay labels through weight and tracking, not a different face */
.mono,.card .k,.tk,.on,.ecard .y,.dcard .m,.subform label{
  font-weight:700;letter-spacing:.08em;text-transform:uppercase;
}
.eyebrow .mono{font-weight:800;letter-spacing:.1em}
.slotrow .tm{font-weight:700;letter-spacing:.06em}
.pcard em,.ecard em,.quote .who em{font-weight:700;letter-spacing:.06em}
.tag{font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.btn{font-weight:800;letter-spacing:.03em;text-transform:uppercase}
.hdr nav a{font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.topic{font-weight:600;letter-spacing:.02em;text-transform:none}
.curated{font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.venue figcaption{font-weight:700;letter-spacing:.03em;text-transform:none}
.subnote{font-weight:600;letter-spacing:0;text-transform:none}
.dcard .f{font-weight:600;letter-spacing:.02em;text-transform:none}
.slotrow .cap{font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.parallel span{font-weight:700;letter-spacing:.1em}
footer a,footer .mono{font-weight:600;letter-spacing:.02em;text-transform:none}
#wixToggle{font-weight:800;letter-spacing:.04em}
.note,.cms-note{font-weight:500;letter-spacing:0;text-transform:none}

/* numbers keep the one thing mono was genuinely good for */
.cd .u .n,.dcard .d b,.card .k,.slotrow .tm,.ecard .y{font-variant-numeric:tabular-nums}
.cd .lab{font-weight:800;letter-spacing:-.02em;text-transform:none}
.cd .lab b{font-weight:600;letter-spacing:.02em;text-transform:none}
.cd .u .x{font-weight:700;letter-spacing:.06em;text-transform:uppercase}

/* ==========================================================================
   DESIGNER ROUND 2
   vCon purple is exactly #6A0DAD. Blue carries every bold. Colour never stops.
   ========================================================================== */
:root{ --purple:#6A0DAD; --green:#0A6E3D; --amberlbl:#8A5A00; }

/* doors-open banner is blue, not black */
#cdWrap{background:var(--blue)!important;padding:0}
/* one clock on the page. This is a marker, not a timer. */
#cdWrap .cd{min-height:0;height:auto;padding:6px 0;display:flex;justify-content:center;align-items:center}

#cdWrap .cd .lab{font-size:clamp(17px,1.9vw,20px)}
.cd .lab{color:#fff!important}
.cd .lab b{color:#fff!important;opacity:.92}
.cd .u .n{color:#fff!important}
.cd .u .x{color:#DDE4FF!important}
.cd .go{background:#fff!important;color:var(--blue)!important}

/* Jeff in colour, bigger, blue ring */
.curator img{width:clamp(150px,19vw,215px);height:clamp(150px,19vw,215px);border:5px solid var(--blue);filter:none}
.curator h2.sec,.curator .lede strong{color:var(--blue)!important}
.curator .lede{color:#0E1320}
/* every bold goes blue, small text stays black */
strong,.prose p strong,.lede strong,.aud-full h4,.acard h4,.obox b,.nextup b,.ch,.card h4,.slotrow b,.pcard b{color:var(--blue)!important}
h2.sec{color:var(--blue)!important}
.finale h2,.finale h2.sec{color:#fff!important}
#cdWrap *,.venue figcaption{color:inherit}
.venue figcaption{background:var(--blue);color:#fff!important}

/* vCon Summit = #6A0DAD */
.tracklane{border-top-color:var(--purple)!important}
.tracks .tracklane:last-of-type{border-top-color:#FFC93D!important}
.tracklane:first-of-type .trackhead h3{color:var(--purple)!important}
.tracklane:first-of-type .slotrow .tm{color:var(--purple)!important}
.tracklane:first-of-type .slotrow b{color:var(--purple)!important}
.tracklane:first-of-type .slotrow .cap{background:var(--purple)!important;color:#fff!important}
/* VoiceAI LIVE! labels in green, not yellow */
.tracks .tracklane:last-of-type .trackhead h3{color:#8A5A00!important}
.tracks .tracklane:last-of-type .slotrow .tm{color:var(--green)!important}
.tracks .tracklane:last-of-type .slotrow b{color:var(--green)!important}
.tracks .tracklane:last-of-type .slotrow .cap{background:var(--green)!important;color:#fff!important}
.parallel span{color:var(--ink2)}

/* membership gets a real box, and the Report lives inside it */
#join .col{background:#fff;border:4px solid var(--blue);border-radius:5px;padding:clamp(26px,3.4vw,46px);max-width:calc(var(--col) - 8px)}
#join .obox{border-left-color:var(--purple)}
#join .obox:nth-child(2){border-left-color:var(--blue)}
#join .obox.hot{border-left-color:var(--green)}
#join .nextup{border:3px dashed var(--blue)}
.reportbox{margin-top:22px;padding:24px;background:var(--blue);border-radius:4px;
  display:grid;grid-template-columns:1fr 1fr;gap:26px;align-items:center}
@media (max-width:820px){.reportbox{grid-template-columns:1fr}}
.reportbox .ch{color:#fff!important;font-size:26px}
.reportbox p{color:#DDE4FF;margin:8px 0 0;font-size:17px}
.reportbox label{display:block;color:#fff;font-weight:700;margin-bottom:9px;font-size:16px}
.reportbox input{width:100%;padding:16px;border-radius:3px;border:2px solid #fff;font-size:18px}
.reportbox .btn.solid{background:#fff;color:var(--blue);border-color:#fff}

/* sponsor bar between sections - replaces the dead space */
.sponsorbar{background:#fff;border-top:3px solid var(--blue);border-bottom:3px solid var(--blue);padding:20px 0}
.bar-in{display:flex;align-items:center;justify-content:space-between;gap:26px;flex-wrap:wrap}
.bar-in img{height:34px;width:auto;object-fit:contain;opacity:.9}
@media (max-width:820px){.bar-in img{height:26px}}

/* sponsors BIG */
.spo-big{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:26px}
@media (max-width:860px){.spo-big{grid-template-columns:repeat(2,1fr)}}
.logo.big{background:#fff;border:3px solid var(--blue);border-radius:4px;aspect-ratio:3/2;
  display:grid;place-items:center;padding:26px}
.logo.big img{max-height:110px;max-width:100%;width:auto;object-fit:contain}

/* community photos in colour */
.gal{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:26px}
@media (max-width:860px){.gal{grid-template-columns:repeat(2,1fr)}}
/* twelve identical uncaptioned photos said nothing. Six, each saying something. */
.cshot{margin:0}
.cshot img{width:100%;height:100%;object-fit:cover;display:block}
.cshot figcaption{margin-top:8px;font-size:16px;line-height:1.4;color:#3A4157}
.gal img{width:100%;aspect-ratio:3/2;object-fit:cover;border:3px solid var(--blue);border-radius:4px;filter:none}

/* speakers: colour photos, blue names, company in blue */
.pcard .ph img{filter:none!important}
.pcard b{color:var(--blue)!important}
.pcard span{color:#0E1320}
.pcard em{color:var(--purple)!important;text-transform:none;letter-spacing:.01em;font-size:17px}

/* Who Should Attend - blue bolds, less dead air */
.aud-full article{border-top:5px solid var(--blue)}
.aud-full .ic{color:var(--blue)}
.pad{padding:clamp(38px,4.4vw,64px) 0}

/* the quote loses its tiny photo treatment */
.quote{border-left:5px solid var(--purple)}
.quote .who b{color:var(--blue)!important}

/* header: the VE mark sits in a blue tile (source art is white letters), and
   the full event name gets room so nothing wraps onto the button */
.hdr img{filter:none!important;height:34px;background:var(--blue);padding:7px 9px;border-radius:4px;box-sizing:content-box}
.hdr .col{flex-wrap:nowrap;gap:18px;min-height:74px}
.hdr .nm{font-size:17px;line-height:1.2;white-space:normal;max-width:22ch}
.hdr nav{gap:18px;flex-wrap:nowrap}
.hdr nav a{font-size:15px;white-space:nowrap}
.hdr .btn{padding:14px 20px;font-size:15px;white-space:nowrap}
@media (max-width:1180px){.hdr nav{display:none}}
@media (max-width:640px){.hdr .nm{font-size:15px;max-width:14ch}}

.thesis-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:clamp(26px,4vw,52px);align-items:center}
@media (max-width:900px){.thesis-grid{grid-template-columns:1fr}}
.tj{margin:0}
.tj img{width:100%;height:auto;display:block;border:4px solid var(--blue);border-radius:5px}
.tj figcaption{margin-top:10px;font-size:16px;font-weight:700;color:var(--blue)}

.spo-big{display:flex!important;flex-wrap:wrap;justify-content:center;gap:20px}
.spo-big .logo.big{flex:0 1 calc(33.333% - 14px);min-width:250px}
@media (max-width:860px){.spo-big .logo.big{flex:0 1 calc(50% - 10px);min-width:200px}}

.presenting{background:#fff;border:5px solid var(--blue);border-radius:5px;padding:34px;margin-top:26px;
  display:flex;flex-direction:column;align-items:center;gap:18px}
.ptag{font-size:17px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#fff;
  background:var(--blue);padding:10px 18px;border-radius:3px}
.presenting img{max-height:220px;max-width:min(620px,100%);width:auto;object-fit:contain}
@media (max-width:700px){.presenting img{max-height:130px}}
.spo-big{margin-top:20px}

/* ===== ROUND 3 =====================================================
   No boxes. Purple is reserved for the vCon Foundation only. Hover is
   light blue. Bolds are blue. Register repeats down the page.
   =================================================================== */
:root{ --hover:#0FA3C7; --green:#0A6E3D; }

/* hover never uses Foundation purple */
.btn:hover,.btn.solid:hover{background:var(--hover)!important;border-color:var(--hover)!important;color:#fff!important}
.reportbox .btn.solid:hover{background:var(--hover)!important;color:#fff!important}

/* we do not live in boxes - cards become open blocks with a top rule */
.card,#why .card,#door .card,.acard,.aud-full article,.obox,.pcard,.ecard{
  background:transparent!important;border:0!important;border-top:4px solid var(--blue)!important;
  border-radius:0!important;box-shadow:none!important;padding:20px 0 22px!important}
.card:hover,.pcard:hover,.obox:hover,#door .card:hover{transform:none!important;box-shadow:none!important}
.tracklane{background:transparent!important;border:0!important;border-top:6px solid var(--purple)!important;
  border-radius:0!important;padding:20px 0 0!important}
.tracks .tracklane:last-of-type{border-top-color:var(--green)!important}
.spo-big .logo.big,.presenting{border:0!important;background:transparent!important;box-shadow:none!important}
.presenting{padding:10px 0 26px!important}
.venue,.tj img,.gal img{border:0!important;border-radius:0!important}
.dcard{background:transparent!important;border:0!important;border-left:4px solid var(--blue)!important;border-radius:0!important;padding-left:20px!important}
#join .col{border:0!important;background:transparent!important;padding:0!important}

/* the vCon Foundation section is the ONE place purple belongs */
#join .eyebrow .mono,#join h2.sec,#join .obox b,#join .nextup b,#join .nextup .mono{color:var(--purple)!important}
#join .obox,#join .nextup{border-top-color:var(--purple)!important}
#join .nextup{border:0!important;border-top:4px solid var(--purple)!important}
#join .btn.solid{background:var(--purple)!important;border-color:var(--purple)!important}
#join .btn.solid:hover{background:var(--hover)!important;border-color:var(--hover)!important}
.reportbox{background:var(--purple)!important;border-radius:0!important}
/* purple nowhere else */
.pcard em{color:var(--blue)!important;font-size:18px!important;font-weight:500!important;letter-spacing:normal!important;margin-top:3px!important}
.ecard em,.quote .who em{color:var(--blue)!important}
.quote{border-left-color:var(--blue)!important}

/* VoiceAI LIVE! title matches its column */
.tracks .tracklane:last-of-type .trackhead h3{color:var(--green)!important}

/* every bold blue - What to Expect included */
strong,.prose p strong,.lede strong,b:not(.dcard b):not(.cd b){color:var(--blue)!important}
ul.exp li{color:#0E1320}

/* speakers: 4 across, centred, company reads like the title */
.rep.c4.spk{grid-template-columns:repeat(4,1fr)!important;gap:26px 22px}
@media (max-width:1000px){.rep.c4.spk{grid-template-columns:repeat(2,1fr)!important}}
@media (max-width:560px){.rep.c4.spk{grid-template-columns:1fr!important}}
.pcard{text-align:center}
.pcard .ph{border-radius:50%;max-width:210px;margin:0 auto}
.pcard b{display:block;margin-top:14px;font-size:20px}
.pcard span,.pcard em{display:block;font-size:18px;line-height:1.45;font-weight:500}
.pcard span{color:#0E1320;margin-top:4px}

/* presenting-sponsor divider bar */
.sponsorbar{background:transparent;border-top:3px solid var(--blue);border-bottom:3px solid var(--blue);padding:26px 0}
.bar-in{justify-content:center;gap:24px}
.bar-in img{height:70px}
.barlab{font-size:16px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
@media (max-width:700px){.bar-in{flex-direction:column}.bar-in img{height:52px}}

/* all community photos */
.gal{grid-template-columns:repeat(4,1fr)}
@media (max-width:900px){.gal{grid-template-columns:repeat(2,1fr)}}

/* MOBILE - classic Wix is laid out separately, so this is the spec for it */
@media (max-width:760px){
  .hgrid,.thesis-grid,.tracks,.subwrap,.reportbox,.curator{grid-template-columns:1fr!important;display:block!important}
  .hero-side{width:100%!important;margin-top:22px}
  .curator img{margin-bottom:16px}
  .offer{grid-template-columns:1fr!important}
  .spo-big .logo.big{flex:0 1 100%!important}
  .nextup{display:block!important}
  .nextup .btn{margin-top:14px;width:100%}
  .cta .btn,.finale .btn{width:100%}
  .hdr .col{flex-wrap:wrap!important;height:auto;padding:10px 0}
  .hdr .nm{max-width:none;font-size:16px}
  h1.t{font-size:34px!important}
  .tracklane{margin-bottom:26px}
}
.regstrip{background:var(--blue);padding:22px 0;text-align:center}
.regstrip .btn.solid{background:#fff!important;color:var(--blue)!important;border-color:#fff!important;font-size:19px}
.regstrip .btn.solid:hover{background:var(--hover)!important;color:#fff!important;border-color:var(--hover)!important}

/* Oct 14-15 schedule */
.day2{margin-top:26px}
.d2head{display:flex;align-items:baseline;gap:16px;padding-bottom:12px;border-bottom:4px solid var(--blue)}
.d2n{font-size:19px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--blue)}
.d2head .ch{font-size:24px;color:var(--blue)!important}
.d2rows{margin-top:4px}
.d2row{display:flex;gap:20px;padding:14px 0;border-bottom:1px solid var(--rule)}
.d2row span{flex:0 0 168px;font-size:18px;font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums}
.d2row b{font-size:19px;color:var(--blue)!important}
.d2row.hl b{color:var(--green)!important}
@media (max-width:640px){.d2row{display:block}.d2row span{display:block;margin-bottom:4px}}
/* tighter after Oct 13 */
.tracks{margin-bottom:6px}
/* quote now sits under the photo */
.tj .quote{margin-top:20px;border-left:5px solid var(--blue);padding-left:20px}
.tj .quote q{font-size:clamp(22px,2.6vw,30px);display:block;line-height:1.2}
.tj .quote .who{margin-top:12px;font-size:17px}
/* presenting sponsor bigger in the break */
.bar-in img{height:118px!important}
@media (max-width:700px){.bar-in img{height:80px!important}}
.barlab{font-size:18px}
/* community photos keep their shape, no crop */
.gal{grid-template-columns:repeat(3,1fr);gap:16px;align-items:start}
@media (max-width:900px){.gal{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.gal{grid-template-columns:1fr}}
.gal img{width:100%;height:auto!important;aspect-ratio:auto!important;object-fit:contain!important}
/* every remaining bold blue, including the closing block */
.finale strong,.finale b,#expect strong,#expect b,ul.exp li b,.prose strong{color:var(--blue)!important}
.finale .lede strong{color:#fff!important}

.d2head.oct13{margin-bottom:22px;border-bottom-color:#0E1320}
.d2head.oct13 .d2n,.d2head.oct13 .ch{color:var(--purple)!important}
.pcard span{color:var(--blue)!important}

/* community photos: whole images, never cropped. masonry columns let each
   keep its own proportions instead of being forced into a box. */
.gal{display:block!important;column-count:3;column-gap:16px}
@media (max-width:900px){.gal{column-count:2}}
@media (max-width:560px){.gal{column-count:1}}
.gal img{width:100%;height:auto!important;aspect-ratio:auto!important;object-fit:contain!important;
  display:block;margin:0 0 16px;break-inside:avoid;border:0!important;border-radius:0!important}

/* closing block in blue, not black */
.finale{background:var(--blue)!important}
.finale h2,.finale h2.sec{color:#fff!important}
.finale .lede,.finale p{color:#DDE4FF!important}
.finale .btn{border-color:#fff!important;color:#fff!important;background:transparent!important}
.finale .btn.solid{background:#fff!important;color:var(--blue)!important;border-color:#fff!important}
.finale .btn:hover,.finale .btn.solid:hover{background:var(--hover)!important;color:#fff!important;border-color:var(--hover)!important}
footer{background:var(--blue-deep)!important;color:#DDE4FF!important}
footer .ftlogo{height:34px;width:auto;display:block;margin-bottom:10px}
footer a{color:#DDE4FF!important}
footer a:hover{color:#fff!important}

/* REGRESSION FIX 1: the Subscribe button inherited #join's purple and landed
   purple-on-purple (1.26:1, effectively invisible). White on the purple panel. */
.reportbox .btn.solid,#join .reportbox .btn.solid{
  background:#FFFFFF!important;color:var(--purple)!important;border-color:#FFFFFF!important}
.reportbox .btn.solid:hover,#join .reportbox .btn.solid:hover{
  background:var(--hover)!important;color:#fff!important;border-color:var(--hover)!important}

/* REGRESSION FIX 2: header nav and its button had slipped to 15px */
.hdr nav a,.hdr .btn,.hdr .btn.solid{font-size:16.5px!important}

/* vCon is always vCon. text-transform was rendering it VCON, so any element
   carrying the word opts out of case transformation entirely. */
.novcase,.novcase *{text-transform:none!important}

.codebox{margin-top:20px;padding:22px 24px;background:#fff;border:3px dashed var(--purple);border-radius:0}
.codebox b{display:block;font-size:21px;color:var(--purple)!important;letter-spacing:-.02em}
.codebox p{margin:8px 0 0;font-size:18px;line-height:1.6;color:#0E1320}
.codebox a{color:var(--purple)!important;font-weight:700;text-decoration:underline;text-underline-offset:3px}
.codebox a:hover{color:var(--hover)!important}

/* sponsor tiers: presenting > gold > silver */
.tierlab{margin:30px 0 12px;font-size:18px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--blue)}
.spo-gold{display:flex!important;flex-wrap:wrap;justify-content:center;gap:22px}
.spo-gold .logo.gold{flex:0 1 calc(33.333% - 16px);min-width:250px;background:transparent;border:0;
  aspect-ratio:auto;display:grid;place-items:center;padding:18px}
.spo-gold .logo.gold img{max-height:130px;max-width:100%;width:auto;object-fit:contain}
.spo-silver{display:flex!important;flex-wrap:wrap;justify-content:center;gap:20px}
.spo-silver .logo.silver{flex:0 1 calc(25% - 15px);min-width:190px;background:transparent;border:0;
  aspect-ratio:auto;display:grid;place-items:center;padding:14px}
.spo-silver .logo.silver img{max-height:78px;max-width:100%;width:auto;object-fit:contain}
@media (max-width:820px){.spo-gold .logo.gold{flex:0 1 calc(50% - 11px)}.spo-silver .logo.silver{flex:0 1 calc(50% - 10px)}}
/* mailing list block, styled like the Report but blue */
.mailbox{margin-top:20px;padding:24px;background:var(--blue);border-radius:0;
  display:grid;grid-template-columns:1fr 1fr;gap:26px;align-items:center}
@media (max-width:820px){.mailbox{grid-template-columns:1fr}}
.mailbox .ch{color:#fff!important;font-size:26px}
.mailbox p{color:#DDE4FF;margin:8px 0 0;font-size:17px}
.mailbox label{display:block;color:#fff;font-weight:700;margin-bottom:9px;font-size:16px}
.mailbox input{width:100%;padding:16px;border-radius:3px;border:2px solid #fff;font-size:18px}
.mailbox .btn.solid{background:#fff!important;color:var(--blue)!important;border-color:#fff!important}
.mailbox .btn.solid:hover{background:var(--hover)!important;color:#fff!important;border-color:var(--hover)!important}








/* The hero right column was a 287px photo above 500px of nothing while the left
   column carried everything. Proof goes in the dead space: faces above the fold
   without making the hero one pixel taller. */
.herofaces{margin-top:16px}
.hfrow{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.hface img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:50%;
  border:2px solid var(--blue);display:block}
.hface:hover img{border-color:var(--hover)}
.hfmore{display:block;margin-top:12px;font-size:16px;font-weight:700;color:var(--blue);
  text-decoration:underline;text-underline-offset:4px}
.hfmore:hover{color:var(--hover)}
@media (max-width:820px){.hfrow{grid-template-columns:repeat(8,1fr)}}



/* the brand is a link: top of page here, home from the other pages.
   ".hdr .nm{margin-right:auto}" was the spacer that pushed the nav right. Once
   the name moved inside this anchor that auto margin only pushed within the
   link, so the brand and AGENDA collided. The spacer belongs on the link. */
.hdr .brand{display:flex;align-items:center;gap:14px;text-decoration:none;
  margin-right:auto;min-width:0}
.hdr .brand .nm{margin-right:0}
.hdr .col{flex-wrap:wrap;row-gap:10px}
.hdr .brand .nm{color:#0E1320}

/* back to top, appears once you are past the first screen */
#totop{position:fixed;right:20px;bottom:20px;z-index:60;display:none;
  width:52px;height:52px;border-radius:50%;background:var(--blue);color:#fff;
  align-items:center;justify-content:center;font-size:23px;line-height:1;
  text-decoration:none;box-shadow:0 3px 14px rgba(14,19,32,.34)}
