@media (max-width:620px){#totop{right:14px;bottom:14px;width:48px;height:48px}}


/* ==========================================================================
   REVIEW NOTES, 10 Aug
   "Business runs on conversation" is the argument, so it is set big and bold.
   The presenting sponsor is the biggest cheque, so it reads that way. And the
   hero photo fills the right column instead of leaving dead space under it.
   ========================================================================== */
.thesis-grid .prose p:first-child{font-size:clamp(22px,2.6vw,29px);line-height:1.32;
  font-weight:800;letter-spacing:-.025em;color:#0E1320}
.thesis-grid .prose p:first-child + p{margin-top:16px}

.sponsorbar .barlab{font-size:clamp(16px,1.8vw,19px);font-weight:800;letter-spacing:.08em}
.sponsorbar .bar-in img{height:clamp(46px,5.2vw,74px)!important;width:auto}
.sponsorbar{padding:clamp(24px,3vw,34px) 0}
#sponsors .ptag{font-size:clamp(17px,2vw,21px);font-weight:800;letter-spacing:.07em}
#sponsors .spo-pres img,#sponsors .presenting img{max-height:190px!important}

/* hero photo carries the column rather than floating in it */
.hero-side .venue img{width:100%;height:clamp(300px,34vw,430px);object-fit:cover}
@media (max-width:820px){.hero-side .venue img{height:clamp(190px,44vw,280px)}}


/* If the sale runs on thirty years of producing events, the track record
   belongs in the hero, not 40% down the page. */
.strip.hero .curated{margin:20px 0 0;font-size:clamp(18px,2vw,21px);font-weight:700;
  letter-spacing:0;text-transform:none;color:#0E1320!important;line-height:1.35}
.strip.hero .curated b{color:var(--blue)!important;font-weight:800}
.strip.hero .curated span{display:block;font-weight:500;font-size:clamp(16px,1.7vw,18px);
  color:#3A4157;margin-top:4px;letter-spacing:0;text-transform:none}

/* The history ran 1997 to 2008 and then jumped to 2026, which read as a gap.
   There was no gap. Jeff never stopped, and the past events prove it. */
.curator .nostop{font-size:clamp(19px,2.1vw,22px);font-weight:700;line-height:1.4;color:#0E1320}
.curator .nostop a{color:var(--blue)!important;font-weight:800;text-decoration:underline;text-underline-offset:3px}
.curator .nostop a:hover{color:var(--hover)!important}

/* Six competing type voices in one block meant nothing receded. One lead, the
   rest plain. Reviewer's fix, and he was right. */
.curator .passion{font-size:clamp(20px,2.2vw,23px);font-weight:800;line-height:1.36;
  letter-spacing:-.015em;color:#0E1320}
.curator p:not(.passion),.curator p:not(.passion) strong{font-size:19px!important;
  font-weight:500!important;line-height:1.62!important;letter-spacing:0!important;
  color:#3A4157!important;margin-top:11px!important}
.curator .promise{font-weight:700!important;color:#0E1320!important}
.curator .wiki{color:var(--blue)!important;font-weight:800;text-decoration:underline;text-underline-offset:3px}
.curator .wiki:hover{color:var(--hover)!important}

/* what people actually buy, in Jeff's words */
.curator .promise{font-size:clamp(20px,2.3vw,25px);font-weight:800;letter-spacing:-.02em;
  line-height:1.3;color:var(--blue)!important;max-width:30ch}

/* ==========================================================================
   HERO, LAUREN'S NOTES
   Title in brand blue, not grey. Nothing tiny. One action, not two. More room
   from the left edge on a phone, where 20px was crowding the margin.
   ========================================================================== */
.strip.hero h1.t{color:var(--blue)!important}
.strip.hero h1.t small{color:#0E1320!important;font-size:18px;letter-spacing:.10em;margin-bottom:14px}
.strip.hero .sub{font-size:clamp(21px,2.4vw,26px);line-height:1.35;font-weight:700;
  color:#0E1320!important;max-width:26ch;margin-top:14px}
.strip.hero .tag{font-size:16px;letter-spacing:.03em;padding:11px 16px}
.strip.hero .herothesis{margin-top:22px}
.strip.hero .herourge{font-size:clamp(19px,2.1vw,22px);font-weight:700}
@media (max-width:820px){
  .col{padding:0 26px}
  /* the header was taking 142px of the fold. Mark only, one row. */
  .hdr .col{height:56px;min-height:56px;flex-wrap:nowrap;gap:10px;padding-top:0;padding-bottom:0}
  .hdr .brand .nm{display:none}
  .hdr .brand img{height:30px}
  .hdr .btn.solid{padding:8px 14px;font-size:16px}
  /* the hero was 1,024px on a phone. One thesis line, one chip. */
  .strip.hero .herothesis{font-size:clamp(20px,5.2vw,24px)}
  /* hide whole sentences, not the line breaks between them. Hiding the <br>s
     ran the text together with no space and looked like a rendering fault. */
  .strip.hero .herothesis span:not(:last-child){display:none}
  .strip.hero .tags .tag:nth-child(2){display:none}
  .strip.hero .curated span{display:none}
  .strip.hero h1.t{font-size:clamp(34px,8.4vw,52px)}
  .strip.hero .sub{font-size:clamp(19px,4.8vw,23px);max-width:none}
  .strip.hero .herothesis{font-size:clamp(20px,5.2vw,25px)}
}

/* the early-bird bar: tighter box, and the words that matter are the big ones */
.ebird{padding:clamp(11px,1.4vw,15px) 0}
.ebird .eb-in .eb-lab{font-size:clamp(19px,2.1vw,23px);line-height:1.2}
.ebird .eb-in .eb-lab .ebhead{display:block;font-weight:800;letter-spacing:-.03em}
.ebird .eb-in .eb-lab b{font-weight:600;font-size:clamp(16px,1.7vw,18px);margin-top:5px}
.ebclk .u{padding:5px 9px;min-width:54px}
.ebclk .n{font-size:clamp(17px,1.9vw,21px)}
.ebclk .x{font-size:15px;margin-top:4px}
.evt{color:var(--blue)!important;font-weight:800}
/* the event name inherits whatever the surface needs. The register bar has a
   WHITE button with blue text, so white-on-white was invisible there. */
.finale .evt,footer .evt,.navy .evt{color:#fff!important}
.regstrip .btn.solid .evt{color:var(--blue)!important}
.herourge{margin:16px 0 0;font-size:clamp(17px,1.9vw,19px);font-weight:600;color:#0E1320}
.hero .herourge b{font-weight:800;color:var(--blue)!important}

/* the thesis moved into the hero. It is the key message and it was three
   sections down, below the fold on every device. */
.herothesis{margin:18px 0 0;font-weight:800;letter-spacing:-.03em;
  line-height:1.16;font-size:clamp(21px,2.7vw,30px);color:#0E1320}
.hero .herothesis{color:var(--blue)!important}
.hero .herothesis span{display:block}
.hero .herothesis b{font-weight:800;color:var(--blue)!important}
@media (max-width:820px){.herothesis{font-size:clamp(20px,5.4vw,26px)}}

/* event names in the hero date card are bold. Done in CSS, not <b>, because the
   global "every bold goes blue" rule would repaint them on the dark card. */
.hero .dcard .d span{font-weight:700}
/* register bars carry the deadline, not just the button */
.regstrip .col{display:flex;align-items:center;justify-content:center;gap:10px 20px;flex-wrap:wrap}
.regstrip .ebtag{font-size:17.5px;font-weight:600;color:#fff!important;letter-spacing:.01em}
@media (max-width:620px){.regstrip .col{flex-direction:column}.regstrip .ebtag{font-size:16.5px}}

/* ==========================================================================
   SPEAKER GRID ON MOBILE
   Measured at 390px: the grid was falling to ONE column, so 22 speakers ran
   8,428px tall, about eleven screens of nothing but faces. The lineup strip
   above already does the "see who is speaking" job, so down here the grid goes
   two-up and compact. Same 22 people, roughly a third of the height.
   ========================================================================== */
@media (max-width:700px){
  #speakers .rep.c4.spk{grid-template-columns:repeat(2,1fr)!important;gap:20px 14px}
  #speakers .pcard .ph{width:100%;aspect-ratio:1/1}
  #speakers .pcard .ph img{width:100%;height:100%;object-fit:cover}
  #speakers .pcard b{font-size:17px;line-height:1.22}
  #speakers .pcard span{font-size:15px;line-height:1.3}
  #speakers .pcard em{font-size:15px}
}

/* ==========================================================================
   LINEUP STRIP
   The full 22-card grid two-up on a phone is 11 rows of photographs, which is
   a scroll wall exactly where the page should be moving. This is one row at
   any width, swipeable, and it stays one row at 30 speakers. The full grid
   lives further down at full size.
   ========================================================================== */
.spkstrip{padding-top:clamp(30px,4vw,54px);padding-bottom:clamp(26px,3.4vw,44px)}
.striphead{display:flex;align-items:baseline;justify-content:space-between;gap:20px;flex-wrap:wrap}
.facerail{display:flex;gap:18px;overflow-x:auto;margin-top:24px;padding:4px 2px 16px;
  scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.facerail::-webkit-scrollbar{height:9px}
.facerail::-webkit-scrollbar-track{background:var(--rule);border-radius:5px}
.facerail::-webkit-scrollbar-thumb{background:var(--blue);border-radius:5px}
.face{flex:0 0 138px;scroll-snap-align:start;text-align:center}
.face img{width:116px;height:116px;border-radius:50%;object-fit:cover;
  border:3px solid var(--blue);display:block;margin:0 auto 11px}
.spkstrip .facerail .face b{display:block;font-size:17px;line-height:1.24;
  font-weight:800;color:#0E1320!important}
.spkstrip .facerail .face span{display:block;font-size:16px;line-height:1.3;
  font-weight:500;color:#3A4157!important;margin-top:3px}

.railnote{margin:2px 0 0;font-size:16px;color:#3A4157}
.railnote a{color:var(--blue)!important;font-weight:700;text-decoration:underline;text-underline-offset:3px}
.railnote a:hover{color:var(--hover)!important}
/* nothing below 16px, including speaker roles and companies */
#speakers .pcard span,#speakers .pcard em{font-size:16px}
@media (max-width:620px){.face{flex:0 0 116px}.face img{width:98px;height:98px}}

/* ==========================================================================
   LEFTOVER FROM THE DARK-TO-LIGHT FLIP
   .strip.blue used to be a blue band, so its list bullets and row rules were
   painted white. It is a white card now, which left 7px white dots and a
   0.24-alpha white divider on a white ground - invisible. A text-contrast
   audit does not catch ::before, which is why this survived.
   ========================================================================== */
.strip.blue ul.exp li::before,.blue ul.exp li::before{background:var(--blue)!important}
.strip.blue ul.exp li,.blue ul.exp li{border-bottom-color:var(--rule)!important}

/* The mailing-list block lives inside #join, and "#join .btn.solid" (1,1,1)
   outranks ".mailbox .btn.solid" (0,2,1) - so the button came out blue text on
   the purple Foundation fill, ratio 1.26. Same trap the Subscribe button hit.
   Match the ID specificity instead of adding another !important. */
#join .mailbox .btn.solid{background:#fff!important;color:var(--blue)!important;border-color:#fff!important}
#join .mailbox .btn.solid:hover{background:var(--hover)!important;color:#fff!important;border-color:var(--hover)!important}

/* ==========================================================================
   EARLY-BIRD BAND
   Defined here, used on BOTH pages - the registration page lifts this
   stylesheet at build time, so there is one definition, not two.

   Yellow FILL with ink text, deliberately: the doors-open countdown directly
   above it is blue, and two blue countdown bars in a row read as a duplicate.
   Yellow is fill-only per the design system (1.47 as text, 12.07 as fill),
   so every word on it is ink, never yellow.
   ========================================================================== */
.ebird{background:var(--yellow);padding:clamp(20px,2.8vw,30px) 0}
.eb-in{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:20px}
.ebird .eb-lab{margin:0;color:#0E1320!important;font-weight:800;letter-spacing:-.022em;
  line-height:1.22;font-size:clamp(20px,2.4vw,27px)}
/* the global rule forces every <b> blue; on yellow that is unreadable.
   (0,3,1) beats b:not(.dcard b):not(.cd b) at (0,2,3). */
.ebird .eb-in .eb-lab b{display:block;margin-top:7px;color:#3A2E00!important;
  font-weight:600;font-size:clamp(16px,1.7vw,18px);letter-spacing:.01em}
/* ==========================================================================
   PROGRAM - Lauren's notes
   The vertical "co-located" label is gone; the header already says the day is
   two co-located events. The divider it carried moves onto .parallel itself,
   so the two tracks stay separated without the word.
   ========================================================================== */
.tracks .parallel{border-left:2px dashed var(--line)}
@media (max-width:1100px){
  .tracks .parallel{border-left:0;border-top:2px dashed var(--line);
    width:100%;min-height:0;margin:20px 0}
}
/* Day markers are black. */
.d2head .d2n,.d2head.oct13 .d2n{color:#0E1320!important}

/* The Report is a Substack with its own list - link out, never collect a second
   list beside it. #join .btn.solid is purple, so match that specificity. */
.substk{display:flex;flex-direction:column;align-items:flex-start;gap:12px;justify-content:center}
/* the Report box is the purple Foundation fill on both pages - white button,
   white note. #join .btn.solid is an ID rule, so match its specificity. */
.reportbox .substk .subnote{margin:0;font-size:16px;font-weight:600;color:#fff!important}
#join .reportbox .substk .btn.solid,.reportbox .substk .btn.solid{
  background:#fff!important;color:var(--purple)!important;border-color:#fff!important}
#join .reportbox .substk .btn.solid:hover,.reportbox .substk .btn.solid:hover{
  background:var(--hover)!important;border-color:var(--hover)!important;color:#fff!important}

.ebird .eb-lab{flex:1 1 340px}
.eb-right{display:flex;align-items:center;gap:clamp(14px,1.8vw,24px);flex-wrap:wrap}
.ebclk{display:flex;gap:11px;align-items:center}
.ebclk .u{background:rgba(14,19,32,.09);border:2px solid #0E1320;padding:10px 14px;
  text-align:center;min-width:74px;border-radius:2px}
.ebclk .n{display:block;font-size:clamp(24px,3vw,34px);font-weight:800;color:#0E1320;
  line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.ebclk .x{display:block;margin-top:6px;font-size:16px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:#0E1320}
.ebird .btn.solid,.ebird .eb-in .btn.solid{background:#0E1320!important;color:#fff!important;
  border-color:#0E1320!important}
.ebird .btn.solid:hover,.ebird .eb-in .btn.solid:hover{background:var(--blue)!important;
  color:#fff!important;border-color:var(--blue)!important}
@media (max-width:760px){
  .ebclk .u{min-width:60px;padding:8px 10px}
  .eb-in{flex-direction:column;align-items:flex-start;gap:16px}
  /* the row uses flex:1 1 340px on the label. Once the container is a COLUMN
     that 340px basis becomes a HEIGHT, which left a huge empty yellow block on
     phones. Reset it. */
  .ebird .eb-lab{flex:0 0 auto}
  .eb-right{width:100%;justify-content:space-between}
}

/* ==========================================================================
   JEFF'S FRAMING - What to Expect
   His words, set as the lead statement. Everything already in this section
   stays underneath it.
   ========================================================================== */
.knows{border-left:6px solid var(--blue);padding:2px 0 2px 26px;margin:22px 0 4px;max-width:46ch}
.knows p{margin:0;font-weight:800;letter-spacing:-.022em;line-height:1.24;
  font-size:clamp(23px,2.9vw,31px);color:var(--blue)!important}
.knows p + p{margin-top:16px;font-weight:600;letter-spacing:-.004em;line-height:1.5;
  font-size:clamp(18px,2vw,21px);color:#0E1320!important}

/* ==========================================================================
   THE ROOM - who convenes
   One band above Who Should Attend. The five audience cards below it then
   read as the detail under it.
   ========================================================================== */
.layer{padding-top:clamp(34px,4.6vw,64px);padding-bottom:clamp(30px,4vw,52px)}
.layer h2.sec{max-width:20ch}
.layer .lede{margin-top:14px;max-width:54ch}
.constit{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.constit span{font-size:17px;font-weight:700;letter-spacing:.01em;line-height:1.2;
  padding:12px 18px;background:#fff;border:2px solid var(--blue);color:var(--blue);border-radius:2px}
.unbound{margin-top:26px;font-size:clamp(20px,2.3vw,25px);font-weight:800;
  letter-spacing:-.02em;line-height:1.3;color:#0E1320}
@media (max-width:620px){.constit span{font-size:16px;padding:10px 14px}}

/* ---- review 4 fixes ---- */
/* #join was 1209px on mobile: the three offer boxes repeat the lede verbatim.
   Keep the grid on desktop, collapse to a plain list on mobile. */
@media (max-width:820px){
  #join .offer{display:block!important;margin-top:16px}
  #join .obox{border:0!important;border-top:2px solid var(--purple)!important;
    padding:10px 0 0!important;margin:0 0 10px!important;background:transparent!important}
  #join .obox p{display:none!important}
  #join .obox .on{display:inline;margin-right:8px}
  #join .obox b{display:inline}
}
/* Eleven photographs one-per-row was 1394px. Two up. */
@media (max-width:560px){.gal{column-count:2!important}}
/* Five gold logos in one column, heights ranging 98px to 166px. */
@media (max-width:860px){
  .spo-gold .logo.gold{flex:0 1 calc(50% - 11px)!important;min-width:0!important}
  .spo-gold .logo.gold img{max-height:96px!important}
}
/* #stayintouch sat below the finale in the same blue, reading as debris that
   fell off it. Ground both cards on white with an outline instead. */
#stayintouch .mailbox{background:#fff!important;border:3px solid var(--blue)}
#stayintouch .mailbox .ch{color:var(--blue)!important}
#stayintouch .mailbox p{color:#3A4157!important}

/* a{color:inherit} would render these as plain text. They are the only inline

.curator .lede a{color:var(--blue);text-decoration:underline;text-underline-offset:3px;
  text-decoration-thickness:2px;font-weight:700}
.curator .lede a:hover{color:var(--hover)}

/* ---- review 5 ---- */
/* The lede and the three rows state the same three facts. Rows are scannable,
   the lede is prose; on a phone keep the rows. Both stay on desktop. */
@media (max-width:820px){#join .lede{display:none!important}}
/* The Substack card was left a solid purple slab beside a white outlined one,

#stayintouch .reportbox{background:#fff!important;border:3px solid var(--blue)!important;
  border-radius:0;padding:24px}
#stayintouch .reportbox .ch{color:var(--blue)!important}
#stayintouch .reportbox p{color:#3A4157!important}
#stayintouch .reportbox .subnote{color:#3A4157!important}
#stayintouch .reportbox .btn.solid{background:var(--blue)!important;color:#fff!important;
  border-color:var(--blue)!important}
#stayintouch .reportbox .btn.solid:hover{background:var(--hover)!important;
  border-color:var(--hover)!important;color:#fff!important}
/* Silver got the treatment gold got. */
@media (max-width:860px){

  .spo-silver .logo.silver img{max-height:64px!important}
}

/* One countdown at a time. #cdWrap (doors open) is hidden until the early-bird
   deadline passes, then the script below swaps them. */
#cdWrap{display:none}
body.past-earlybird #cdWrap{display:block}
body.past-earlybird .ebird{display:none!important}

/* Review 6, two content bugs.
   1. On 29 Aug the hero still read "Early-bird pricing ends August 28. Save up
      to $475." A stalled clock looks broken; a stale price claim reads as true.
      Same hook as the countdown swap. Replacement copy is Jeff's call; until
      then the page says nothing false. */
body.past-earlybird .herourge{display:none!important}
body.past-earlybird .regstrip .ebtag{display:none!important}
/* 2. Hiding the obox paragraphs AND the lede on mobile deleted four facts that

@media (max-width:820px){#join .obox p{display:block!important;margin:4px 0 0}}

/* Back on the home page at Jeff's request. a{color:inherit} would render the
   address as plain text, and #join forces purple on headings, so say it here. */

#join .codenote a{color:var(--purple);font-weight:700;text-decoration:underline;
  text-underline-offset:3px;text-decoration-thickness:2px}
#join .codenote a:hover{color:var(--hover)}

/* ---- Lauren's desktop review, 11 Aug ---- */
/* 1. Header is a white bar. Words blue, black on hover. */
.hdr .nm{color:var(--blue)!important}
.hdr nav a{color:var(--blue)!important}
.hdr nav a:hover{color:#000!important}
/* 6. ".btn" is inline-flex, and flex DISCARDS the whitespace between items, so

.btn{gap:.34em}
/* 9. keep the city and state together */
.nb{white-space:nowrap}
/* 10. the small line in the final box */
.finale .lede{font-weight:700}

.sponsorbar .barlab{font-size:19px!important;letter-spacing:.06em}
.sponsorbar .bar-in img{max-height:104px!important;height:auto;width:auto}

.spo-silver .logo.silver img{max-height:56px!important;height:56px;object-fit:contain;width:auto}
/* 11. footer in brand blue with the logo reversed out */
footer{background:var(--blue)!important;color:#fff!important}
footer a{color:#fff!important}
footer a:hover{color:var(--sky)!important}
footer .ftlogo{filter:brightness(0) invert(1);height:34px;width:auto}

/* The register bar now carries the long form, which no longer fits one line at
   19px. Stack it deliberately rather than let it look like a wrap. */
.regstrip .btn.solid{flex-direction:column;gap:2px;line-height:1.25;padding:16px 24px}
.regstrip .btn.solid .evt{display:block}
/* footer .mono was picking up its own grey; the footer is brand blue now. */
footer .mono,footer span,footer .mono a{color:#fff!important}
footer .mono a:hover{color:var(--sky)!important}

/* ---- review 7 ---- */
/* Lauren asked for the footer navigation off. On desktop the header carries it,
   so that is right. Below 1180px ".hdr nav" is display:none and there is no
   hamburger, so removing it left a phone with NO route from the home page to the
   agenda, and made registration a dead end. Desktop keeps her change; mobile
   gets navigation back. */
.ftnav{display:none}
@media (max-width:1180px){
  .ftnav{display:flex;gap:18px;flex-wrap:wrap;margin:14px 0 6px}
  .ftnav a{color:#fff!important;font-weight:700}
}
/* ".nb" was unconditional nowrap to stop "Georgia" orphaning. The span is 350px,
   so at 320 and 360 the whole PAGE scrolled sideways. Fixing an orphan is not
   worth a horizontal scrollbar on the most common phone width. */
@media (max-width:430px){.nb{white-space:normal}}
/* The register button carries the long form now. On a phone it set in four
   lines; shrink the type so it sets in two. */
@media (max-width:600px){
  .regstrip .btn.solid{font-size:15px;padding:14px 18px}
  .regstrip .btn.solid .evt{font-size:15px}
}


.spkhead{padding-top:clamp(30px,4vw,56px);padding-bottom:clamp(18px,2.6vw,30px)}

#speakers .pcard em{color:#3A4157!important;font-size:17px;font-weight:600;font-style:normal}

/* Lauren #4: names, titles and companies all blue on the speakers page. */

.pcard span,#speakers .pcard span{color:var(--blue)!important}
.pcard em,#speakers .pcard em{color:var(--blue)!important}

/* All three stay blue, as Lauren asked. But colour was the only thing telling
   them apart, and with it gone the company was rendering LARGER than the role.

.pcard b,#speakers .pcard b{font-size:20px!important;font-weight:800!important}
.pcard span,#speakers .pcard span{font-size:17px!important;font-weight:600!important}
.pcard em,#speakers .pcard em{font-size:15px!important;font-weight:500!important;opacity:.88}

/* 2. the event name is always bold and blue, wherever it appears */
.evt,.evname{color:var(--blue)!important;font-weight:700!important}
/* 3. the paragraph beside Jeff's photo matches the others. The old selector
   (.curator .prose p) matched NOTHING: there is no .prose inside .curator, so
   it was reported fixed twice while doing nothing. The real culprit is
   .curator .promise{max-width:30ch} against the 62ch its siblings get. */
.curator .promise{max-width:62ch!important;margin-left:0!important;margin-right:0!important}
/* 4. speaker names, titles and companies all blue */
.pcard b,.pcard span,.pcard em{color:var(--blue)!important}
/* 5. presenting sponsor fills its space. The old rule was inert:
   `.sponsorbar img` is (0,1,1) and lost to the template's
   `.sponsorbar .bar-in img{height:clamp(46px,5.2vw,74px)!important}` (0,2,1).
   Match the specificity and win on source order instead. */
.sponsorbar .bar-in img{height:clamp(92px,11vw,156px)!important;max-height:none!important;
  width:auto!important;max-width:min(560px,90%)!important;object-fit:contain!important}
.sponsorbar .barlab{font-size:clamp(20px,2.2vw,26px)!important;font-weight:800!important;
  letter-spacing:.06em!important;color:var(--blue)!important}
.sponsorbar .bar-in{gap:clamp(24px,3vw,38px)!important}
.sponsorbar{padding:clamp(26px,3.4vw,40px) 0!important}
@media (max-width:700px){
  .sponsorbar .bar-in img{height:clamp(64px,13vw,92px)!important}
  .sponsorbar .barlab{font-size:19px!important}
}
/* 7. silver sponsor logos all the same size */
.silver img,.sponsors .tier2 img,.sponsorgrid img{height:64px!important;width:auto!important;
  object-fit:contain!important;max-width:200px!important}
/* 9. Atlanta and Georgia stay on one line */
.finale h2 .nowrap,.nowrap{white-space:nowrap}
/* 9b. and the whole phrase holds one line, the way home already sets it. */
.finale h2 .nb{white-space:nowrap}
@media (max-width:640px){.finale h2 .nb{white-space:normal}}
/* Lauren round 2, item 5: the Foundation block sat 16px left of every other
   section. #join .col kept padding:0 and a narrowed max-width from when it was
   a white bordered box. Put it back on the same column as #who and #sponsors. */
#join .col{padding:0 20px!important;max-width:var(--col)!important}
@media (max-width:820px){#join .col{padding:0 26px!important}}
/* 10. the smaller line in the final box is bold */
.finale .lede,.strip.navy.finale .lede{font-weight:700!important}
/* 13. The vCon Foundation reads purple on the ticket page */
/* 13 colour. The template already marks these spans purple INLINE
   (style="color:var(--purple)"), but .eyebrow .mono{color:#0F2ED0!important}
   overrides inline, so every vCon Foundation kicker rendered blue. Home only
   looked right because a #join rule happened to cover it. Honour the inline
   intent wherever it was written, on every page, instead of chasing containers:
   the earlier attempt used .members and the markup is id="members". */
.eyebrow .mono[style*="--purple"],.eyebrow.vcf .mono{color:var(--purple)!important}
/* 15. the VIP rows reach the edge of their card */
.tcard .row,.tcard .priceline{margin-left:0!important;margin-right:0!important;width:100%!important}
/* 16. Lauren: "Everything" was set as loud as the tier headings. The old rule
   matched NOTHING: there is no .tcard and no .badge in the markup, the element
   is <span class="flag"> inside <div class="t best">. It also overlapped the
   card title. Band above every card title so the three titles stay aligned. */
.tix .t{padding-top:58px!important}
.tix .t.best .flag{top:18px!important;right:auto!important;left:24px!important;
  font-size:16px!important;font-weight:700!important;line-height:1.25!important;
  padding:4px 11px!important;letter-spacing:.08em!important}
:root:has(body > .strip.finale:last-of-type){
  /* 19. no white band between the closing box and the footer. These four pages
     are dragged to home's height in Wix, so the leftover below the last strip
     showed the canvas. It now reads as more of the blue closing box. */
  background:var(--blue,#1438F1)
}

<div class="strip ice spkhead">
  <div class="col">
    <h1>Speakers</h1>
    <p class="where">Fall '26 Voice and Conversations on the Net &middot; October 13&ndash;15, 2026 &middot; Atlanta, Georgia</p>
    <p class="spknote"><b>More speakers are added each week.</b></p>
  </div>
</div>
<script>
(function(){
  "use strict";
  function pad(n){return n<10?"0"+n:String(n);}
  function run(ids,target){
    // Pages carry different subsets of these cells: home and speakers have all
    // four, registration and agenda have days/hours/minutes and no seconds.
    // Requiring all four made the whole clock bail on those two pages and show
    // dashes for ever. Update whichever cells exist.
    var d=document.getElementById(ids[0]),h=document.getElementById(ids[1]),
        m=document.getElementById(ids[2]),s=document.getElementById(ids[3]);
    if(!d&&!h&&!m&&!s) return;            // this page carries no such clock
    function put(el,v){ if(el) el.textContent=v; }
    (function tick(){
      var left=target-Date.now();
      if(left<=0){put(d,"0");put(h,"00");put(m,"00");put(s,"00");return;}
      var sec=Math.floor(left/1000);
      put(d,Math.floor(sec/86400));
      put(h,pad(Math.floor(sec/3600)%24));
      put(m,pad(Math.floor(sec/60)%60));
      put(s,pad(sec%60));
      setTimeout(tick, s ? 1000 : 15000);  // no seconds cell, no need to tick fast
    })();
  }
  var EB=new Date("2026-08-28T23:59:59-04:00").getTime();
  var DOORS=new Date("2026-10-13T09:00:00-04:00").getTime();
  run(["ebd","ebh","ebm","ebs"],EB);
  run(["d","h","m","s"],DOORS);
  function swap(){document.body.classList.toggle("past-earlybird",Date.now()>EB);}
  swap(); setInterval(swap,60000);

  // The event mailing list is a plain GET form now, wired in the markup. No
  // JavaScript, so nothing here can stop it working.

  // Auto-height. Wix page code listens for this and resizes the frame, so no
  // one drags a bottom edge, and regenerating the speaker list from 22 to 30
  // does not mean re-dragging every page.
  var last=0;
  function post(){
    var hgt=Math.max(document.body.scrollHeight,document.documentElement.scrollHeight);
    if(Math.abs(hgt-last)>2){last=hgt;
      try{parent.postMessage({vonHeight:hgt},"*");}catch(e){}}
  }
  post();
  addEventListener("load",post);
  addEventListener("resize",post);
  setInterval(post,1000);
  if(window.ResizeObserver) new ResizeObserver(post).observe(document.body);
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(post);
})();
</script></body></html>
